/* ===================================================================
   Fichas de Matrícula · Colegio Marina de Chile
   Paleta tomada de la insignia: azul marino, azul acero y dorado.
   =================================================================== */
:root {
  --navy: #12347a;
  --navy-2: #0c2459;
  --blue: #1f5fbf;
  --blue-2: #3b7ddd;
  --sky: #e8f0fc;
  --sky-2: #f4f7fc;
  --gold: #c9a227;
  --gold-2: #f3e3a6;
  --ok: #18915a;
  --ok-bg: #e3f6ec;
  --warn: #c98a00;
  --warn-bg: #fff4d6;
  --bad: #d23f3f;
  --bad-bg: #fde8e8;
  --info: #2a6fd6;
  --text: #1b2a41;
  --muted: #5b6b85;
  --line: #dbe4f3;
  --card: #ffffff;
  --bg: #f2f6fc;
  --radius: 14px;
  --shadow: 0 6px 24px rgba(18, 52, 122, .08);
  --shadow-lg: 0 20px 60px rgba(12, 36, 89, .25);
  --font: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-h: 'Poppins', system-ui, sans-serif;
  --font-d: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sand: #e2c27d;
  --ink: #0a1f4d;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--text); background: var(--bg); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-h); margin: 0 0 .4em; line-height: 1.25; color: var(--navy); }
h1, h2, .page-h h2, .m-title { font-family: var(--font-d); font-weight: 700; letter-spacing: -.01em; }
.eyebrow { font-family: var(--font); font-weight: 800; font-size: 12.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.serif { font-family: var(--font-d); }
a { color: var(--blue); }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
.grow { flex: 1; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.right { margin-left: auto; }

/* ---------------------------- botones ---------------------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; background: var(--ink); color: #fff;
  padding: 10px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: transform .12s, box-shadow .12s, background .15s; text-decoration: none; white-space: nowrap; }
.btn:hover { background: #163a85; box-shadow: 0 6px 18px rgba(10, 31, 77, .22); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
.btn.gold { background: var(--gold); color: #1d1500; }
.btn.gold:hover { background: #b38d17; }
.btn.ok { background: var(--ok); }
.btn.ok:hover { background: #127247; }
.btn.bad { background: var(--bad); }
.btn.bad:hover { background: #a92e2e; }
.btn.ghost { background: #fff; color: var(--navy); border-color: var(--line); }
.btn.ghost:hover { background: var(--sky); box-shadow: none; }
.btn.wa { background: #25d366; color: #fff; }
.btn.wa:hover { background: #1da851; }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.lg { padding: 14px 26px; font-size: 16px; }
.icon-btn { width: 34px; height: 34px; padding: 0; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line);
  background: #fff; cursor: pointer; font-size: 16px; transition: background .15s; }
.icon-btn:hover { background: var(--sky); }
.icon-btn.wa:hover { background: #dcf8e6; }

/* ---------------------------- formularios ---------------------------- */
label { font-weight: 700; font-size: 13.5px; color: var(--navy); display: block; margin-bottom: 5px; }
.input, input:not([type]), input[type=text], input[type=password], input[type=email], input[type=tel], input[type=number], input[type=date], input[type=datetime-local], input[type=time], input[type=url], select, textarea {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; transition: border .15s, box-shadow .15s; }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue-2); box-shadow: 0 0 0 4px rgba(59, 125, 221, .15); }
input:disabled, select:disabled, textarea:disabled { background: var(--sky-2); color: #44536d; cursor: not-allowed; }
.req { color: var(--bad); margin-left: 2px; }
.help { display: block; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.field { min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field.error input, .field.error select, .field.error textarea, .field.error .radios { border-color: var(--bad); background: #fff8f8; box-shadow: 0 0 0 4px rgba(210, 63, 63, .12); }
.field.error label { color: var(--bad); }
.field .err-msg { color: var(--bad); font-size: 12.5px; font-weight: 700; margin-top: 4px; display: none; }
.field.error .err-msg { display: block; }
.radios { display: flex; gap: 10px; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; }
.radios label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; margin: 0; cursor: pointer; color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 18px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; color: var(--text); cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--ok); flex: none; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.shake { animation: shake .45s; }
@keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(210, 63, 63, .45); } 100% { box-shadow: 0 0 0 14px rgba(210, 63, 63, 0); } }
.field.focus-hint { border-radius: 12px; animation: pulse-ring 1s 2; }

/* ---------------------------- tarjetas ---------------------------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; border: 1px solid #e6edf8; }
.card + .card { margin-top: 18px; }
.card-h { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.card-h h3 { margin: 0; font-size: 17px; }
.sec-num { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--navy), var(--blue)); color: #fff; display: flex; align-items: center;
  justify-content: center; font-weight: 800; font-family: var(--font-h); flex: none; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; }
.b-pendiente { background: #eef1f6; color: #5b6b85; }
.b-en_proceso { background: var(--warn-bg); color: #8a5d00; }
.b-enviada { background: #e2ecfd; color: var(--blue); }
.b-desbloqueada { background: #f3e8fd; color: #7a3fc0; }
.b-matriculada { background: var(--ok-bg); color: var(--ok); }
.b-retirado { background: var(--bad-bg); color: var(--bad); }
.b-gold { background: var(--gold-2); color: #6b5300; }
.b-blue { background: var(--sky); color: var(--navy); }
.b-gray { background: #eef1f6; color: var(--muted); }
.b-red { background: var(--bad-bg); color: var(--bad); }

/* ---------------------------- portada / ingreso ---------------------------- */
.login { min-height: 100vh; position: relative; overflow: hidden; background: #fbfaf7; }
.login::before, .login::after { content: ''; position: absolute; border-radius: 50%; filter: blur(10px); pointer-events: none; }
.login::before { width: 620px; height: 620px; left: -180px; top: -220px; background: radial-gradient(circle, rgba(59, 125, 221, .16), transparent 65%); }
.login::after { width: 560px; height: 560px; right: -160px; bottom: -200px; background: radial-gradient(circle, rgba(226, 194, 125, .32), transparent 65%); }
.login-wrap { position: relative; z-index: 1; max-width: 1220px; margin: 0 auto; padding: 26px 32px 40px; min-height: 100vh; display: flex; flex-direction: column; }
.login-nav { display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 46px; height: 52px; object-fit: contain; }
.brand b { font-family: var(--font-d); font-size: 19px; display: block; line-height: 1.1; color: var(--ink); }
.brand span { font-size: 11.5px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.nav-link { margin-left: auto; border: 0; background: #fff; color: var(--ink); font-weight: 800; padding: 10px 16px; border-radius: 999px; cursor: pointer;
  box-shadow: 0 2px 10px rgba(10, 31, 77, .08); display: inline-flex; gap: 8px; align-items: center; }
.nav-link:hover { box-shadow: 0 6px 18px rgba(10, 31, 77, .14); }
.login-grid { flex: 1; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(360px, .85fr); gap: 56px; align-items: center; padding: 30px 0 10px; }
.pill { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #efe6d2; color: #8a6a1f; font-weight: 800; font-size: 12.5px;
  letter-spacing: .14em; text-transform: uppercase; padding: 7px 14px 7px 10px; border-radius: 999px; box-shadow: 0 2px 10px rgba(138, 106, 31, .08); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--sand); box-shadow: 0 0 0 4px rgba(226, 194, 125, .3); }
.hero-title { font-family: var(--font-d); color: var(--ink); font-weight: 700; font-size: clamp(42px, 5.6vw, 76px); line-height: 1.02; letter-spacing: -.025em; margin: 22px 0 20px; }
.hero-title em { font-style: italic; color: #c39a3e; }
.hero-lead { font-size: 18px; line-height: 1.7; color: #4a5872; max-width: 560px; margin: 0 0 30px; }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn.dark { background: var(--ink); color: #fff; border-radius: 999px; padding: 15px 26px; }
.btn.dark:hover { background: #163a85; box-shadow: 0 10px 28px rgba(10, 31, 77, .25); }
.btn.soft { background: #fff; color: var(--ink); border-radius: 999px; padding: 15px 22px; box-shadow: 0 2px 10px rgba(10, 31, 77, .08); }
.btn.soft:hover { background: #fff; box-shadow: 0 8px 22px rgba(10, 31, 77, .14); }
.hero-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 44px; }
.hero-step { background: rgba(255, 255, 255, .8); backdrop-filter: blur(6px); border: 1px solid #edf0f6; border-radius: 18px; padding: 16px; box-shadow: 0 4px 16px rgba(10, 31, 77, .05); }
.hero-step .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; margin-bottom: 10px; }
.hero-step:nth-child(1) .ic { background: #e8f0fc; } .hero-step:nth-child(2) .ic { background: #fdf3dc; }
.hero-step:nth-child(3) .ic { background: #e3f6ec; } .hero-step:nth-child(4) .ic { background: #f3e8fd; }
.hero-step b { display: block; font-size: 14.5px; color: var(--ink); }
.hero-step span { font-size: 12.5px; color: var(--muted); line-height: 1.45; display: block; margin-top: 2px; }
.login-side { position: relative; }
.login-box { width: 100%; max-width: 440px; margin-left: auto; position: relative; }
.login-box .card { padding: 30px; border-radius: 26px; border: 1px solid #edf0f6; box-shadow: 0 30px 70px rgba(10, 31, 77, .12); }
.login-box .card h2 { font-size: 26px; color: var(--ink); }
.login-box .crest-float { position: absolute; top: -34px; right: 26px; width: 72px; height: 80px; background: #fff; border-radius: 20px; padding: 8px; box-shadow: 0 12px 30px rgba(10, 31, 77, .15); z-index: 2; }
.login-box .crest-float img { width: 100%; height: 100%; object-fit: contain; }
.login-foot { text-align: center; color: #98a2b6; font-size: 12.5px; margin-top: 18px; }
.tabs { display: flex; background: #eef1f7; padding: 5px; border-radius: 14px; gap: 5px; margin-bottom: 18px; }
.tab { flex: 1; border: 0; background: transparent; padding: 11px 10px; border-radius: 10px; font-weight: 800; cursor: pointer; color: var(--muted); }
.tab.active { background: #fff; color: var(--navy); box-shadow: 0 2px 8px rgba(18, 52, 122, .12); }
.login-box .hint { background: #f5f8fd; border-left: 4px solid var(--sand); padding: 10px 12px; border-radius: 8px; font-size: 13px; color: var(--navy); }
.demo-banner { background: linear-gradient(90deg, #fff4d6, #fdeec0); color: #6b4c00; border: 1px solid #f0d27a; border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-bottom: 16px; }
.demo-banner code { background: #fff; padding: 1px 6px; border-radius: 5px; font-weight: 800; cursor: pointer; }

/* ---------------------------- barra superior ---------------------------- */
.topbar { position: sticky; top: 0; z-index: 30; background: linear-gradient(90deg, var(--navy-2), var(--navy) 60%, #1a4596); color: #fff; padding: 10px 22px;
  display: flex; align-items: center; gap: 14px; box-shadow: 0 4px 18px rgba(12, 36, 89, .25); }
.topbar img { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 10px; padding: 3px; }
.topbar .t1 { font-family: var(--font-d); font-weight: 700; font-size: 18px; line-height: 1.1; }
.topbar .t2 { font-size: 12px; color: var(--gold-2); }
.topbar .btn.ghost { background: rgba(255, 255, 255, .1); color: #fff; border-color: rgba(255, 255, 255, .25); }
.topbar .btn.ghost:hover { background: rgba(255, 255, 255, .2); }
.user-chip { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: var(--navy-2); display: flex; align-items: center; justify-content: center; font-weight: 900; }
.user-chip .n { font-weight: 800; font-size: 14px; line-height: 1.1; }
.user-chip .r { font-size: 12px; opacity: .8; }

/* ---------------------------- familias ---------------------------- */
.wrap { max-width: 1060px; margin: 0 auto; padding: 24px 18px 120px; }
.welcome { display: flex; gap: 24px; align-items: center; border: 1px solid #edf0f6; padding: 30px 32px; position: relative; overflow: hidden; border-radius: 24px;
  background: radial-gradient(420px 260px at 100% 0%, rgba(226, 194, 125, .28), transparent 70%), radial-gradient(380px 240px at 0% 120%, rgba(59, 125, 221, .10), transparent 70%), #fff; }
.welcome h2 { margin: 4px 0 8px; color: var(--ink); font-size: clamp(26px, 3.4vw, 38px); line-height: 1.1; }
.welcome .eyebrow { color: #a07d2c; }
.welcome p { color: #4a5872 !important; }
.welcome .ring { background: conic-gradient(var(--ok) calc(var(--p) * 1%), #edf0f6 0); width: 104px; height: 104px; }
.welcome .ring span { width: 86px; height: 86px; font-family: var(--font-d); font-size: 24px; color: var(--ink); }
body { background: #f7f8fb; }
.topbar { background: rgba(255, 255, 255, .92) !important; color: var(--ink) !important; backdrop-filter: blur(10px); box-shadow: 0 1px 0 #e8ecf3, 0 6px 20px rgba(10, 31, 77, .05) !important; }
.topbar .t2 { color: #a07d2c !important; }
.topbar img { box-shadow: none; }
.topbar .btn.ghost { background: #f3f5fa !important; color: var(--ink) !important; border-color: #e3e8f1 !important; }
.topbar .btn.ghost:hover { background: #e9edf5 !important; }
.avatar { background: var(--ink) !important; color: #fff !important; }
.update-banner { display: flex; gap: 16px; align-items: flex-start; background: linear-gradient(120deg, #fff8e6, #fffdf6); border: 1.5px solid var(--sand); border-radius: var(--radius); padding: 18px 20px; margin-top: 18px; }
.update-banner .ico { font-size: 32px; }
.update-banner b.t { color: #7a5c00; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.field.pedido { background: #fffaf0; border-radius: 12px; padding: 8px; margin: -8px; box-shadow: inset 0 0 0 1.5px var(--sand); }
/* interruptores de un clic */
.toggle { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px 5px 6px;
  font-weight: 800; font-size: 12.5px; color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap; }
.toggle i { width: 30px; height: 18px; border-radius: 999px; background: #cfd8e8; position: relative; transition: background .15s; flex: none; }
.toggle i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
.toggle.on i::after { transform: translateX(12px); }
.toggle.on { color: var(--text); }
.toggle.t-ob.on { border-color: #f3b4b4; background: #fff5f5; } .toggle.t-ob.on i { background: var(--bad); }
.toggle.t-fa.on { border-color: #9fdcbc; background: #f1fbf5; } .toggle.t-fa.on i { background: var(--ok); }
.toggle.t-vi.on { border-color: #b9cff3; background: #f3f7ff; } .toggle.t-vi.on i { background: var(--blue); }
.toggle:hover { border-color: var(--blue-2); }
.toggle:disabled { opacity: .55; cursor: not-allowed; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.num-mat { font-family: var(--font-d); font-weight: 700; color: var(--navy); font-size: 15px; }
.seg { display: inline-flex; background: #e3eaf6; border-radius: 11px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; font-weight: 800; color: var(--muted); cursor: pointer; font-size: 13px; }
.seg button.active { background: #fff; color: var(--navy); box-shadow: 0 1px 6px rgba(18, 52, 122, .12); }
.opt-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.opt-card { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; font-weight: 700; color: var(--text); margin: 0; }
.opt-card input { margin-top: 3px; accent-color: var(--blue); }
.opt-card:has(input:checked) { border-color: var(--blue); background: var(--sky); }
.opt-card small { display: block; font-weight: 600; color: var(--muted); }
.campo-picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; max-height: 300px; overflow-y: auto; background: var(--sky-2); border-radius: 12px; padding: 12px; }
.campo-picks .sec { grid-column: 1 / -1; font-weight: 800; color: var(--navy); font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; margin-top: 8px; }
.progress { height: 12px; background: #e6edf8; border-radius: 999px; overflow: hidden; }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--ok)); border-radius: 999px; transition: width .4s; }
.ring { --p: 0; width: 92px; height: 92px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--ok) calc(var(--p) * 1%), #e6edf8 0); }
.ring span { width: 72px; height: 72px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-weight: 900; font-family: var(--font-h); color: var(--navy); font-size: 19px; }
.subtabs { display: flex; gap: 8px; margin: 22px 0 16px; flex-wrap: wrap; }
.subtab { border: 1.5px solid var(--line); background: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 800; cursor: pointer; color: var(--muted); }
.subtab.active { border-color: var(--blue); color: var(--navy); background: var(--sky); }
.lock-banner { display: flex; gap: 16px; align-items: center; background: linear-gradient(120deg, #e9f8f0, #f5fcf8); border: 1.5px solid #9fdcbc; border-radius: var(--radius); padding: 18px 20px; margin-top: 18px; }
.lock-banner .ico { font-size: 34px; }
.lock-banner b { color: var(--ok); font-size: 16px; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: rgba(255, 255, 255, .96); backdrop-filter: blur(6px); border-top: 1px solid var(--line);
  padding: 12px 22px; display: flex; align-items: center; gap: 14px; box-shadow: 0 -6px 20px rgba(18, 52, 122, .08); }
.autosave { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
.autosave .dot { width: 10px; height: 10px; border-radius: 50%; background: #b8c4d8; }
.autosave.saving .dot { background: var(--warn); animation: blink 1s infinite; }
.autosave.saved .dot { background: var(--ok); }
.autosave.error .dot { background: var(--bad); }
.autosave.saved { color: var(--ok); }
.autosave.error { color: var(--bad); }
@keyframes blink { 50% { opacity: .3; } }
.doc-card { display: flex; gap: 16px; align-items: flex-start; }
.doc-ico { width: 52px; height: 52px; border-radius: 14px; flex: none; display: grid; place-items: center; font-size: 26px; background: var(--sky); }
.doc-card.ok .doc-ico { background: var(--ok-bg); }
.doc-accept { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--sky-2); border: 1.5px dashed var(--line); }
.doc-card.ok .doc-accept { background: var(--ok-bg); border-color: #9fdcbc; }
.acta-box { background: #fffdf3; border: 1.5px solid var(--gold-2); border-radius: var(--radius); padding: 18px 20px; }
.acta-box h3 { color: #7a5c00; }

/* ---------------------------- funcionarios ---------------------------- */
.layout { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 64px); }
.sidebar { background: #fff; border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; text-align: left; padding: 11px 14px; border-radius: 11px;
  font-weight: 700; color: var(--muted); cursor: pointer; margin-bottom: 3px; }
.nav-item:hover { background: var(--sky-2); color: var(--navy); }
.nav-item.active { background: linear-gradient(90deg, var(--sky), #f4f8ff); color: var(--navy); box-shadow: inset 4px 0 0 var(--blue); }
.nav-item .ni { font-size: 18px; width: 22px; text-align: center; }
.nav-sep { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #98a6bd; font-weight: 800; padding: 14px 14px 6px; }
.main { padding: 24px 28px 80px; min-width: 0; }
.page-h { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.page-h h2 { margin: 0; font-size: 24px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.toolbar select, .toolbar input { width: auto; min-width: 170px; }
.toolbar .search { min-width: 240px; flex: 1; max-width: 360px; }
.curso-group { margin-bottom: 20px; padding: 0; overflow: hidden; }
.curso-h { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: linear-gradient(90deg, var(--sky), #fff); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.curso-h h3 { margin: 0; font-size: 17px; }
.chip-stats { display: flex; gap: 6px; flex-wrap: wrap; }
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); padding: 10px 14px; background: #fafcff; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px 14px; border-bottom: 1px solid #eef2f9; vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: #f8fbff; }
table.t .name { font-weight: 800; color: var(--navy); }
table.t .acts { display: flex; gap: 6px; justify-content: flex-end; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
.kpi { background: #fff; border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); border: 1px solid #e6edf8; position: relative; overflow: hidden; }
.kpi .v { font-family: var(--font-h); font-weight: 800; font-size: 30px; color: var(--navy); line-height: 1.1; }
.kpi .l { color: var(--muted); font-weight: 700; font-size: 13px; }
.kpi .i { position: absolute; right: 14px; top: 12px; font-size: 26px; opacity: .9; }
.kpi.k1 { border-top: 4px solid var(--blue); } .kpi.k2 { border-top: 4px solid var(--ok); } .kpi.k3 { border-top: 4px solid var(--warn); } .kpi.k4 { border-top: 4px solid var(--gold); }
.ciclo-card { margin-bottom: 20px; }
.ciclo-h { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.ciclo-h .tag { padding: 4px 12px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 13px; }
.bar { height: 10px; background: #e9eef7; border-radius: 999px; overflow: hidden; width: 90px; flex: none; display: flex; }
.ciclo-card table.t th, .ciclo-card table.t td { padding: 9px 10px; }
.bar > i { display: block; height: 100%; }
.bar .m { background: var(--ok); } .bar .e { background: var(--blue-2); } .bar .p { background: #f0b429; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
tr.subtotal td { background: #f6f9ff; font-weight: 800; color: var(--navy); }
tr.total td { background: var(--navy); color: #fff; font-weight: 800; }
.editor-meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 18px; }
.meta-v { font-weight: 800; color: var(--navy); }
.actionbar { position: sticky; bottom: 0; z-index: 20; margin: 20px -28px -80px; padding: 12px 28px; background: rgba(255, 255, 255, .97); border-top: 1px solid var(--line);
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center; backdrop-filter: blur(6px); }
.field-row { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #eef2f9; }
.field-row:last-child { border-bottom: 0; }
.field-row .fl { flex: 1; min-width: 0; }
.field-row .fl b { color: var(--navy); }
.dropzone { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; background: var(--sky-2); cursor: pointer; transition: border .15s, background .15s; }
.dropzone:hover, .dropzone.over { border-color: var(--blue); background: var(--sky); }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty .e-ico { font-size: 44px; }

/* ---------------------------- modales ---------------------------- */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(9, 22, 52, .55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center;
  padding: 18px; animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: translateY(14px) scale(.96); opacity: 0; } }
.modal { background: #fff; border-radius: 20px; box-shadow: var(--shadow-lg); width: 100%; max-width: 520px; max-height: calc(100vh - 36px); display: flex; flex-direction: column;
  animation: pop .25s cubic-bezier(.2, .9, .3, 1.2); overflow: hidden; }
.modal.wide { max-width: 860px; }
.modal.xwide { max-width: 1100px; }
.modal-b { padding: 26px 28px; overflow-y: auto; }
.modal-h { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
.modal-h h3 { margin: 0; flex: 1; font-size: 18px; }
.modal-f { padding: 14px 24px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; background: #fafcff; }
.modal.center .modal-b { text-align: center; }
.modal.center .modal-f { justify-content: center; }
.m-icon { width: 84px; height: 84px; border-radius: 50%; margin: 4px auto 14px; display: grid; place-items: center; font-size: 40px; }
.m-icon.success { background: var(--ok-bg); color: var(--ok); }
.m-icon.error { background: var(--bad-bg); color: var(--bad); }
.m-icon.warning { background: var(--warn-bg); color: var(--warn); }
.m-icon.info, .m-icon.question { background: var(--sky); color: var(--blue); }
.m-title { font-size: 22px; margin-bottom: 6px; }
.checkmark { width: 56px; height: 56px; }
.checkmark circle { stroke: var(--ok); stroke-width: 3; fill: none; stroke-dasharray: 166; stroke-dashoffset: 166; animation: draw .6s ease-out forwards; }
.checkmark path { stroke: var(--ok); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 48; stroke-dashoffset: 48; animation: draw .35s .5s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.missing-list { text-align: left; margin: 16px 0 0; display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto; }
.missing-item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 1.5px solid #f3c4c4; background: #fff8f8; border-radius: 11px;
  padding: 10px 12px; cursor: pointer; font-weight: 700; color: var(--text); transition: background .15s, transform .1s; }
.missing-item:hover { background: var(--bad-bg); transform: translateX(3px); }
.missing-item small { display: block; color: var(--muted); font-weight: 600; }
.missing-item .go { margin-left: auto; color: var(--bad); font-weight: 900; white-space: nowrap; }
.video-frame { position: relative; padding-top: 56.25%; border-radius: 12px; overflow: hidden; background: #0c2459; }
.video-frame iframe, .video-frame video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.steps { counter-reset: s; display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; text-align: left; }
.steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; background: var(--sky-2); padding: 10px 12px; border-radius: 10px; }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--blue); color: #fff; font-weight: 800; display: grid; place-items: center; flex: none; font-size: 13px; }
.carta-text { white-space: pre-wrap; text-align: left; background: #fffdf6; border: 1px solid var(--gold-2); border-radius: 12px; padding: 18px; line-height: 1.65; }

/* toasts */
#toast-root { position: fixed; right: 18px; bottom: 86px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast { background: var(--navy-2); color: #fff; padding: 11px 16px; border-radius: 11px; box-shadow: var(--shadow-lg); font-weight: 700; font-size: 14px; max-width: 360px; animation: pop .25s; }
.toast.ok { background: var(--ok); } .toast.bad { background: var(--bad); } .toast.info { background: var(--blue); }

/* cargando */
#loading { position: fixed; inset: 0; z-index: 300; background: rgba(255, 255, 255, .7); display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
  font-weight: 800; color: var(--navy); backdrop-filter: blur(2px); }
.spinner { width: 54px; height: 54px; border: 5px solid var(--sky); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===================== documento oficial (impresión / PDF) ===================== */
#print-root { display: none; }
.doc { font-family: Arial, Helvetica, sans-serif; color: #000; font-size: 11px; line-height: 1.35; background: #fff; }
.pdf-mode .doc { width: 740px; }
.doc .pg { padding: 0; }
.doc .page-break { page-break-before: always; break-before: page; }
.doc-head { display: flex; align-items: center; gap: 14px; border-bottom: 2px solid #a9bbdc; padding-bottom: 8px; margin-bottom: 10px; }
.doc-head img { width: 64px; height: 72px; object-fit: contain; }
.doc-head .dh-c { flex: 1; text-align: center; }
.doc-head .dh-c .col { font-size: 15px; font-weight: bold; color: #12347a; text-transform: uppercase; }
.doc-head .dh-c .tit { font-size: 14px; font-weight: bold; margin-top: 3px; letter-spacing: .5px; }
.doc-head .dh-c .sub { font-size: 9.5px; color: #333; }
.doc-head .dh-r { border: 1px solid #a9bbdc; background: #f4f7fc; padding: 5px 8px; font-size: 10px; min-width: 150px; }
.doc-head .dh-r div { display: flex; justify-content: space-between; gap: 8px; }
/* Colores suaves (pastel) para ahorrar tinta al imprimir */
.doc h4 { background: #e4ecf8; color: #12347a; border: 1px solid #b9c9e3; border-left: 4px solid #8fa8d3; font-size: 10.5px; padding: 3px 8px; margin: 10px 0 0; text-transform: uppercase; letter-spacing: .4px; font-family: Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.doc table.dt { width: 100%; border-collapse: collapse; page-break-inside: auto; }
.doc table.dt tr { page-break-inside: avoid; }
.doc table.dt td { border: 1px solid #c3cde0; padding: 3px 6px; vertical-align: top; }
.doc table.dt td.k { background: #f3f6fc; font-weight: bold; width: 21%; color: #12347a; font-size: 10px; }
.doc table.dt td.v { width: 29%; }
.doc .acta { border: 1.5px solid #c9a227; background: #fffdf3; padding: 8px 10px; margin-top: 10px; text-align: justify; }
.doc .acta b.t { display: block; text-align: center; color: #12347a; margin-bottom: 4px; font-size: 11.5px; }
.doc .acta ul { margin: 6px 0 0; padding-left: 18px; }
.doc .signs { display: flex; gap: 22px; margin-top: 46px; page-break-inside: avoid; }
.doc .sign { flex: 1; text-align: center; font-size: 10px; }
.doc .sign .line { border-top: 1.2px solid #000; margin-bottom: 4px; }
.doc .sign b { display: block; font-size: 10.5px; }
.doc .foot { margin-top: 14px; font-size: 8.5px; color: #555; text-align: center; border-top: 1px solid #ccc; padding-top: 4px; }
.doc .carta-body { font-size: 12px; line-height: 1.7; white-space: pre-wrap; text-align: justify; margin-top: 14px; }
.doc .carta-tit { text-align: center; font-size: 14px; font-weight: bold; color: #12347a; margin: 14px 0 4px; text-transform: uppercase; }

@media print {
  @page { size: letter; margin: 12mm 12mm; }
  body { background: #fff; }
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; }
  .doc { font-size: 10.5px; }
}

/* ---------------------------- responsivo ---------------------------- */
@media (max-width: 980px) {
  .login-wrap { padding: 18px 16px 30px; }
  .login-grid { grid-template-columns: 1fr; gap: 50px; padding-top: 22px; }
  .hero-lead { font-size: 16px; }
  .hero-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 30px; }
  .login-box { margin: 0 auto; }
  .nav-link .hide-sm { display: none; }
  .opt-cards { grid-template-columns: 1fr; }
  .campo-picks { grid-template-columns: 1fr; }
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; display: flex; overflow-x: auto; gap: 4px; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav-item { width: auto; white-space: nowrap; margin: 0; }
  .nav-sep { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .editor-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .main { padding: 18px 16px 80px; }

}
@media (max-width: 640px) {

  .modal-b { padding: 20px 18px; }

}
@media (max-width: 1360px) { .hide-md { display: none; } table.t td, table.t th { padding: 9px 10px; } }

/* teléfono con código de país separado · datos condicionales */
.field.oculto { display: none; }
.tel { display: flex; gap: 8px; align-items: stretch; }
.tel .tel-pais { width: auto; flex: none; max-width: 150px; font-weight: 700; background: var(--sky-2); }
.tel .tel-cod { width: 84px; flex: none; text-align: center; font-weight: 700; }
.tel .tel-num { flex: 1; min-width: 0; letter-spacing: .04em; font-weight: 600; }
.field.error .tel input, .field.error .tel select { border-color: var(--bad); background: #fff8f8; }
.pueblos-card { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.meta-ring { --p: 0; width: 120px; height: 120px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--c, var(--ok)) calc(var(--p) * 1%), #edf0f6 0); }
.meta-ring span { width: 96px; height: 96px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-family: var(--font-d); font-weight: 700; font-size: 24px; color: var(--ink); text-align: center; line-height: 1.1; }
.meta-ring small { display: block; font-family: var(--font); font-size: 11px; color: var(--muted); font-weight: 700; }

/* selección múltiple (cursos repetidos) */

.chip-check span { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13.5px; color: var(--muted); transition: all .15s; }
.chip-check input:checked + span { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip-check input:focus-visible + span { box-shadow: 0 0 0 4px rgba(59, 125, 221, .2); }
.chip-check input:disabled + span { opacity: .6; cursor: not-allowed; }

/* calendario de matrícula */
.calendario { background: #fff; border: 1px solid #edf0f6; border-radius: 22px; padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--shadow);
  background-image: radial-gradient(380px 200px at 100% 0%, rgba(226, 194, 125, .22), transparent 70%); }
.cal-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.cal-h .eyebrow { color: #a07d2c; }
.cal-plazo { font-size: 14px; color: var(--muted); margin-top: 2px; }
.cal-plazo b { color: var(--ink); }
.cal-lista { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }
.cal-item { flex: 0 0 auto; min-width: 230px; display: flex; gap: 12px; align-items: center; border: 1.5px solid #edf0f6; border-radius: 16px; padding: 12px 14px; background: #fbfcff; scroll-snap-align: start; }
.cal-item.mio { box-shadow: 0 0 0 3px rgba(195, 154, 62, .55), 0 6px 18px rgba(226, 194, 125, .35); }

/* un color por ciclo */
.cal-item.cc-pre { border-color: #f4b6cc; background: #fff1f6; } .cal-item.cc-pre .cal-dia { background: #d6457a; } .cal-item.cc-pre .cal-ciclo { color: #a8285a; }
.cal-item.cc-1 { border-color: #a8dcb8; background: #effaf2; } .cal-item.cc-1 .cal-dia { background: #2f9e5b; } .cal-item.cc-1 .cal-ciclo { color: #1f7a42; }
.cal-item.cc-2 { border-color: #a9c6f0; background: #eff5fe; } .cal-item.cc-2 .cal-dia { background: #2f6fd1; } .cal-item.cc-2 .cal-ciclo { color: #1f4fa0; }
.cal-item.cc-med { border-color: #cbb7ee; background: #f6f1fd; } .cal-item.cc-med .cal-dia { background: #7a4fc4; } .cal-item.cc-med .cal-ciclo { color: #5b3a9a; }

.cal-dia b { font-family: var(--font-d); font-size: 24px; line-height: 1; }
.cal-dia span { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; opacity: .85; }
.cal-ciclo { font-weight: 800; color: var(--ink); }
.cal-hora { font-size: 13px; color: var(--muted); font-weight: 700; }
.cal-lugar { font-size: 12.5px; color: var(--muted); }
.login .calendario { margin: 26px 0 0; }
.solicitud { display: flex; gap: 14px; align-items: flex-start; }
.solicitud .s-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; background: var(--sky); }
.solicitud.borrado .s-ico { background: var(--bad-bg); }
.nav-item .cnt { margin-left: auto; background: var(--bad); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; font-weight: 800; }
.rank { display: grid; grid-template-columns: minmax(0, 1fr) 140px 40px; gap: 8px 12px; align-items: center; font-size: 14px; }
.rank .bar { width: 100%; }

/* carrusel de la portada */
.carrusel { position: relative; border-radius: 26px; overflow: hidden; aspect-ratio: 16 / 9; background: #0a1f4d; box-shadow: 0 24px 60px rgba(10, 31, 77, .22); margin-top: 34px; }
.car-pista { position: absolute; inset: 0; }
.car-slide { position: absolute; inset: 0; margin: 0; opacity: 0; transition: opacity .9s ease; }
.car-slide.activo { opacity: 1; }
.car-slide img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.06); transition: transform 6s ease; }
.car-slide.activo img { transform: scale(1); }

.cuota-det { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; margin: 8px 0; color: var(--ink); }
.cuota-det i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.cuota-nota { background: #fff4d6; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; color: #6b4a00; margin-bottom: 8px; line-height: 1.5; }
@media (max-width: 700px) { .cuota-card { grid-template-columns: 1fr; gap: 12px; } .cuota-num { font-size: 38px; } }
.cuota-g { color: var(--muted); }
.cuota-g b { color: var(--ink); }
/* aplicación instalable */
.login-nav .pwa-btn { margin-left: auto; }
.pwa-btn.hidden { display: none !important; }
@media (display-mode: standalone) { .pwa-btn { display: none !important; } body { overscroll-behavior-y: none; } }
.pwa-btn { white-space: nowrap; flex: none; }
.pwa-corto { display: none; }
@media (max-width: 640px) { .login-nav { flex-wrap: nowrap; } .login-nav .brand { min-width: 0; } .pwa-largo { display: none; } .pwa-corto { display: inline; } .login-nav .pwa-btn { padding: 8px 12px; font-size: 13px; } }
/* idioma: selector con banderas */
.lang-barra { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 14px 0 0; }
.lang-pregunta { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lang-sel { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.lang-sel button { display: inline-flex; align-items: center; gap: 9px; background: #fff; border: 2px solid #dfe6f3; border-radius: 14px; padding: 9px 14px; font: inherit; font-weight: 800; font-size: 14.5px; color: var(--ink); cursor: pointer; transition: all .15s; }
.lang-sel button:hover { border-color: var(--blue-2); }
.lang-sel button.activo { border-color: var(--blue); background: #eef4ff; box-shadow: 0 0 0 3px rgba(31, 95, 191, .12); }
.bandera { width: 30px; height: 20px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(10, 31, 77, .18); flex: none; display: block; }
.lang-sel.compacto button { padding: 5px 8px; border-width: 1.5px; font-size: 12.5px; gap: 6px; }
.lang-sel.compacto .bandera { width: 22px; height: 15px; }
@media (max-width: 760px) { .lang-sel.compacto span { display: none; } }
/* aviso de confidencialidad */
.privacidad { display: flex; gap: 14px; align-items: flex-start; background: #eef7f1; border: 1px solid #bfe0cb; border-radius: 16px; padding: 14px 18px; margin: 0 0 16px; color: #1d5a3a; }
.privacidad .ico { font-size: 24px; line-height: 1; }
.privacidad b { display: block; font-size: 15px; color: #14502f; }
.privacidad p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.55; color: #2c6a48; }
.privacidad.mini { margin: 12px 0 0; padding: 10px 14px; border-radius: 12px; font-size: 13px; align-items: center; }
.privacidad.mini b { font-size: 13px; }
/* funcionarios: etiqueta en kreyòl junto a cada dato */
.ht-sub { display: block; font-size: 12px; font-weight: 700; color: #00209f; margin-top: 2px; letter-spacing: .01em; }
.badge.b-ht { background: #e7edff; color: #00209f; border: 1px solid #b9c7f5; }
/* ficha impresa de una familia que completó en kreyòl */
.doc .ht-doc { display: block; font-size: 8.5px; color: #00209f; font-weight: normal; margin-top: 1px; }
.doc .ht-bloque { margin-top: 8px; padding: 6px 10px; border-left: 3px solid #9fb0e8; background: #f6f8ff; font-size: 11px; color: #12347a; white-space: pre-wrap; text-align: justify; }
.doc .ht-aviso { margin: 4px 0 8px; padding: 4px 8px; background: #e7edff; border: 1px solid #b9c7f5; border-radius: 4px; font-size: 9.5px; color: #00209f; text-align: center; }
details.trad { grid-column: 1 / -1; border: 1px dashed #b9c7f5; border-radius: 12px; padding: 4px 12px 12px; background: #f6f8ff; }
details.trad summary { cursor: pointer; font-weight: 800; color: #00209f; padding: 8px 0; font-size: 14px; }
.ht-banner { background: #e7edff; border: 1px solid #b9c7f5; border-left: 4px solid #00209f; border-radius: 12px; padding: 10px 14px; margin: 0 0 16px; color: #12347a; font-size: 14px; }

/* Cumplimiento de la ficha (vista del funcionario) */
.cumpl { display: flex; align-items: center; gap: 16px; background: #fff; border: 1px solid var(--line, #e3e7f0); border-left: 5px solid var(--gold, #e0a800); border-radius: 14px; padding: 14px 18px; margin: 0 0 18px; }
.cumpl.ok { border-left-color: var(--ok); background: var(--ok-bg, #eaf7ef); }
.cumpl .meta-ring { width: 76px; height: 76px; }
.cumpl .meta-ring span { width: 60px; height: 60px; font-size: 18px; }
.btn.ok.incompleta { opacity: .6; }
.mail-dom { display: flex; align-items: stretch; }
.mail-dom input { border-top-right-radius: 0; border-bottom-right-radius: 0; flex: 1; min-width: 0; }
.mail-dom span { display: flex; align-items: center; padding: 0 12px; background: var(--sky-2, #eef3fb); border: 1.5px solid var(--line, #d5dce8); border-left: 0; border-radius: 0 10px 10px 0; font-weight: 700; color: var(--navy, #12347a); white-space: nowrap; }

/* Arrastrar y soltar datos de la ficha */
.field-row[draggable="true"] { cursor: grab; }
.field-row .arrastre { flex: none; width: 20px; color: var(--muted); font-size: 18px; line-height: 1; text-align: center; user-select: none; }
.field-row.arrastrando { opacity: .4; }
.field-row.drop-antes { box-shadow: inset 0 3px 0 var(--gold, #c39a3e); }
.field-row.drop-despues { box-shadow: inset 0 -3px 0 var(--gold, #c39a3e); }

/* Modo ordenar: vista compacta de los datos de la ficha */
.modo-ordenar .field-row { padding-top: 5px; padding-bottom: 5px; min-height: 0; }
.modo-ordenar .field-row .toggles, .modo-ordenar .field-row .badge, .modo-ordenar .field-row [data-c="editar"], .modo-ordenar .field-row [data-c="eliminar"] { display: none; }
.modo-ordenar .field-row .fl b { font-size: 13.5px; font-weight: 600; }
.modo-ordenar .sec-drop .curso-h { cursor: pointer; }
.modo-ordenar .sec-drop .curso-h h3::before { content: '▾ '; color: var(--muted); }
.modo-ordenar .sec-drop.plegada .curso-h h3::before { content: '▸ '; }
.modo-ordenar .sec-drop.plegada .field-row { display: none; }

/* Elección «firmas juntas o separadas» */
.firma-ops { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.firma-op { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 2px solid var(--line, #d5dce8); border-radius: 14px; background: #fff; cursor: pointer; font: inherit; color: inherit; }
.firma-op:hover { border-color: #8fa8d3; }
.firma-op.on { border-color: var(--ok, #2f9e5b); background: var(--ok-bg, #eaf7ef); box-shadow: 0 0 0 3px rgba(47,158,91,.18); }
.firma-op .fo-i { font-size: 26px; }
.firma-op small { color: var(--muted); }

</style>
