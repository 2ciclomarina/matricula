/* ===================================================================
   Fichas de Matrícula · Colegio Marina de Chile
   Paleta tomada de la insignia: azul marino, azul acero y dorado.
   =================================================================== */
:root {
  --navy: #12347a;
  --navy-2: #0c2459;
  --blue: #1f5fbf;
  --blue-2: #3b7ddd;
  --sky: #e8f0fc;
  --sky-2: #f4f7fc;
  --gold: #c9a227;
  --gold-2: #f3e3a6;
  --ok: #18915a;
  --ok-bg: #e3f6ec;
  --warn: #c98a00;
  --warn-bg: #fff4d6;
  --bad: #d23f3f;
  --bad-bg: #fde8e8;
  --info: #2a6fd6;
  --text: #1b2a41;
  --muted: #5b6b85;
  --line: #dbe4f3;
  --card: #ffffff;
  --bg: #f2f6fc;
  --radius: 14px;
  --shadow: 0 6px 24px rgba(18, 52, 122, .08);
  --shadow-lg: 0 20px 60px rgba(12, 36, 89, .25);
  --font: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-h: 'Poppins', system-ui, sans-serif;
  --font-d: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sand: #e2c27d;
  --ink: #0a1f4d;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--text); background: var(--bg); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-h); margin: 0 0 .4em; line-height: 1.25; color: var(--navy); }
h1, h2, .page-h h2, .m-title { font-family: var(--font-d); font-weight: 700; letter-spacing: -.01em; }
.eyebrow { font-family: var(--font); font-weight: 800; font-size: 12.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.serif { font-family: var(--font-d); }
a { color: var(--blue); }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
.grow { flex: 1; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.right { margin-left: auto; }

/* ---------------------------- botones ---------------------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; background: var(--ink); color: #fff;
  padding: 10px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: transform .12s, box-shadow .12s, background .15s; text-decoration: none; white-space: nowrap; }
.btn:hover { background: #163a85; box-shadow: 0 6px 18px rgba(10, 31, 77, .22); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
.btn.gold { background: var(--gold); color: #1d1500; }
.btn.gold:hover { background: #b38d17; }
.btn.ok { background: var(--ok); }
.btn.ok:hover { background: #127247; }
.btn.bad { background: var(--bad); }
.btn.bad:hover { background: #a92e2e; }
.btn.ghost { background: #fff; color: var(--navy); border-color: var(--line); }
.btn.ghost:hover { background: var(--sky); box-shadow: none; }
.btn.wa { background: #25d366; color: #fff; }
.btn.wa:hover { background: #1da851; }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.lg { padding: 14px 26px; font-size: 16px; }
.icon-btn { width: 34px; height: 34px; padding: 0; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line);
  background: #fff; cursor: pointer; font-size: 16px; transition: background .15s; }
.icon-btn:hover { background: var(--sky); }
.icon-btn.wa:hover { background: #dcf8e6; }

/* ---------------------------- formularios ---------------------------- */
label { font-weight: 700; font-size: 13.5px; color: var(--navy); display: block; margin-bottom: 5px; }
.input, input[type=text], input[type=password], input[type=email], input[type=tel], input[type=number], input[type=date], input[type=url], select, textarea {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; transition: border .15s, box-shadow .15s; }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue-2); box-shadow: 0 0 0 4px rgba(59, 125, 221, .15); }
input:disabled, select:disabled, textarea:disabled { background: var(--sky-2); color: #44536d; cursor: not-allowed; }
.req { color: var(--bad); margin-left: 2px; }
.help { display: block; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.field { min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field.error input, .field.error select, .field.error textarea, .field.error .radios { border-color: var(--bad); background: #fff8f8; box-shadow: 0 0 0 4px rgba(210, 63, 63, .12); }
.field.error label { color: var(--bad); }
.field .err-msg { color: var(--bad); font-size: 12.5px; font-weight: 700; margin-top: 4px; display: none; }
.field.error .err-msg { display: block; }
.radios { display: flex; gap: 10px; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; }
.radios label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; margin: 0; cursor: pointer; color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 18px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; color: var(--text); cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--ok); flex: none; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.shake { animation: shake .45s; }
@keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(210, 63, 63, .45); } 100% { box-shadow: 0 0 0 14px rgba(210, 63, 63, 0); } }
.field.focus-hint { border-radius: 12px; animation: pulse-ring 1s 2; }

/* ---------------------------- tarjetas ---------------------------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; border: 1px solid #e6edf8; }
.card + .card { margin-top: 18px; }
.card-h { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.card-h h3 { margin: 0; font-size: 17px; }
.sec-num { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--navy), var(--blue)); color: #fff; display: flex; align-items: center;
  justify-content: center; font-weight: 800; font-family: var(--font-h); flex: none; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; }
.b-pendiente { background: #eef1f6; color: #5b6b85; }
.b-en_proceso { background: var(--warn-bg); color: #8a5d00; }
.b-enviada { background: #e2ecfd; color: var(--blue); }
.b-desbloqueada { background: #f3e8fd; color: #7a3fc0; }
.b-matriculada { background: var(--ok-bg); color: var(--ok); }
.b-retirado { background: var(--bad-bg); color: var(--bad); }
.b-gold { background: var(--gold-2); color: #6b5300; }
.b-blue { background: var(--sky); color: var(--navy); }
.b-gray { background: #eef1f6; color: var(--muted); }
.b-red { background: var(--bad-bg); color: var(--bad); }

/* ---------------------------- portada / ingreso ---------------------------- */
.login { min-height: 100vh; position: relative; overflow: hidden; background: #fbfaf7; }
.login::before, .login::after { content: ''; position: absolute; border-radius: 50%; filter: blur(10px); pointer-events: none; }
.login::before { width: 620px; height: 620px; left: -180px; top: -220px; background: radial-gradient(circle, rgba(59, 125, 221, .16), transparent 65%); }
.login::after { width: 560px; height: 560px; right: -160px; bottom: -200px; background: radial-gradient(circle, rgba(226, 194, 125, .32), transparent 65%); }
.login-wrap { position: relative; z-index: 1; max-width: 1220px; margin: 0 auto; padding: 26px 32px 40px; min-height: 100vh; display: flex; flex-direction: column; }
.login-nav { display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 46px; height: 52px; object-fit: contain; }
.brand b { font-family: var(--font-d); font-size: 19px; display: block; line-height: 1.1; color: var(--ink); }
.brand span { font-size: 11.5px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.nav-link { margin-left: auto; border: 0; background: #fff; color: var(--ink); font-weight: 800; padding: 10px 16px; border-radius: 999px; cursor: pointer;
  box-shadow: 0 2px 10px rgba(10, 31, 77, .08); display: inline-flex; gap: 8px; align-items: center; }
.nav-link:hover { box-shadow: 0 6px 18px rgba(10, 31, 77, .14); }
.login-grid { flex: 1; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(360px, .85fr); gap: 56px; align-items: center; padding: 30px 0 10px; }
.pill { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #efe6d2; color: #8a6a1f; font-weight: 800; font-size: 12.5px;
  letter-spacing: .14em; text-transform: uppercase; padding: 7px 14px 7px 10px; border-radius: 999px; box-shadow: 0 2px 10px rgba(138, 106, 31, .08); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--sand); box-shadow: 0 0 0 4px rgba(226, 194, 125, .3); }
.hero-title { font-family: var(--font-d); color: var(--ink); font-weight: 700; font-size: clamp(42px, 5.6vw, 76px); line-height: 1.02; letter-spacing: -.025em; margin: 22px 0 20px; }
.hero-title em { font-style: italic; color: #c39a3e; }
.hero-lead { font-size: 18px; line-height: 1.7; color: #4a5872; max-width: 560px; margin: 0 0 30px; }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn.dark { background: var(--ink); color: #fff; border-radius: 999px; padding: 15px 26px; }
.btn.dark:hover { background: #163a85; box-shadow: 0 10px 28px rgba(10, 31, 77, .25); }
.btn.soft { background: #fff; color: var(--ink); border-radius: 999px; padding: 15px 22px; box-shadow: 0 2px 10px rgba(10, 31, 77, .08); }
.btn.soft:hover { background: #fff; box-shadow: 0 8px 22px rgba(10, 31, 77, .14); }
.hero-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 44px; }
.hero-step { background: rgba(255, 255, 255, .8); backdrop-filter: blur(6px); border: 1px solid #edf0f6; border-radius: 18px; padding: 16px; box-shadow: 0 4px 16px rgba(10, 31, 77, .05); }
.hero-step .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; margin-bottom: 10px; }
.hero-step:nth-child(1) .ic { background: #e8f0fc; } .hero-step:nth-child(2) .ic { background: #fdf3dc; }
.hero-step:nth-child(3) .ic { background: #e3f6ec; } .hero-step:nth-child(4) .ic { background: #f3e8fd; }
.hero-step b { display: block; font-size: 14.5px; color: var(--ink); }
.hero-step span { font-size: 12.5px; color: var(--muted); line-height: 1.45; display: block; margin-top: 2px; }
.login-side { position: relative; }
.login-box { width: 100%; max-width: 440px; margin-left: auto; position: relative; }
.login-box .card { padding: 30px; border-radius: 26px; border: 1px solid #edf0f6; box-shadow: 0 30px 70px rgba(10, 31, 77, .12); }
.login-box .card h2 { font-size: 26px; color: var(--ink); }
.login-box .crest-float { position: absolute; top: -34px; right: 26px; width: 72px; height: 80px; background: #fff; border-radius: 20px; padding: 8px; box-shadow: 0 12px 30px rgba(10, 31, 77, .15); z-index: 2; }
.login-box .crest-float img { width: 100%; height: 100%; object-fit: contain; }
.login-foot { text-align: center; color: #98a2b6; font-size: 12.5px; margin-top: 18px; }
.tabs { display: flex; background: #eef1f7; padding: 5px; border-radius: 14px; gap: 5px; margin-bottom: 18px; }
.tab { flex: 1; border: 0; background: transparent; padding: 11px 10px; border-radius: 10px; font-weight: 800; cursor: pointer; color: var(--muted); }
.tab.active { background: #fff; color: var(--navy); box-shadow: 0 2px 8px rgba(18, 52, 122, .12); }
.login-box .hint { background: #f5f8fd; border-left: 4px solid var(--sand); padding: 10px 12px; border-radius: 8px; font-size: 13px; color: var(--navy); }
.demo-banner { background: linear-gradient(90deg, #fff4d6, #fdeec0); color: #6b4c00; border: 1px solid #f0d27a; border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-bottom: 16px; }
.demo-banner code { background: #fff; padding: 1px 6px; border-radius: 5px; font-weight: 800; cursor: pointer; }

/* ---------------------------- barra superior ---------------------------- */
.topbar { position: sticky; top: 0; z-index: 30; background: linear-gradient(90deg, var(--navy-2), var(--navy) 60%, #1a4596); color: #fff; padding: 10px 22px;
  display: flex; align-items: center; gap: 14px; box-shadow: 0 4px 18px rgba(12, 36, 89, .25); }
.topbar img { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 10px; padding: 3px; }
.topbar .t1 { font-family: var(--font-d); font-weight: 700; font-size: 18px; line-height: 1.1; }
.topbar .t2 { font-size: 12px; color: var(--gold-2); }
.topbar .btn.ghost { background: rgba(255, 255, 255, .1); color: #fff; border-color: rgba(255, 255, 255, .25); }
.topbar .btn.ghost:hover { background: rgba(255, 255, 255, .2); }
.user-chip { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: var(--navy-2); display: flex; align-items: center; justify-content: center; font-weight: 900; }
.user-chip .n { font-weight: 800; font-size: 14px; line-height: 1.1; }
.user-chip .r { font-size: 12px; opacity: .8; }

/* ---------------------------- familias ---------------------------- */
.wrap { max-width: 1060px; margin: 0 auto; padding: 24px 18px 120px; }
.welcome { display: flex; gap: 24px; align-items: center; border: 1px solid #edf0f6; padding: 30px 32px; position: relative; overflow: hidden; border-radius: 24px;
  background: radial-gradient(420px 260px at 100% 0%, rgba(226, 194, 125, .28), transparent 70%), radial-gradient(380px 240px at 0% 120%, rgba(59, 125, 221, .10), transparent 70%), #fff; }
.welcome h2 { margin: 4px 0 8px; color: var(--ink); font-size: clamp(26px, 3.4vw, 38px); line-height: 1.1; }
.welcome .eyebrow { color: #a07d2c; }
.welcome p { color: #4a5872 !important; }
.welcome .ring { background: conic-gradient(var(--ok) calc(var(--p) * 1%), #edf0f6 0); width: 104px; height: 104px; }
.welcome .ring span { width: 86px; height: 86px; font-family: var(--font-d); font-size: 24px; color: var(--ink); }
body { background: #f7f8fb; }
.topbar { background: rgba(255, 255, 255, .92) !important; color: var(--ink) !important; backdrop-filter: blur(10px); box-shadow: 0 1px 0 #e8ecf3, 0 6px 20px rgba(10, 31, 77, .05) !important; }
.topbar .t2 { color: #a07d2c !important; }
.topbar img { box-shadow: none; }
.topbar .btn.ghost { background: #f3f5fa !important; color: var(--ink) !important; border-color: #e3e8f1 !important; }
.topbar .btn.ghost:hover { background: #e9edf5 !important; }
.avatar { background: var(--ink) !important; color: #fff !important; }
.update-banner { display: flex; gap: 16px; align-items: flex-start; background: linear-gradient(120deg, #fff8e6, #fffdf6); border: 1.5px solid var(--sand); border-radius: var(--radius); padding: 18px 20px; margin-top: 18px; }
.update-banner .ico { font-size: 32px; }
.update-banner b.t { color: #7a5c00; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.field.pedido { background: #fffaf0; border-radius: 12px; padding: 8px; margin: -8px; box-shadow: inset 0 0 0 1.5px var(--sand); }
/* interruptores de un clic */
.toggle { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px 5px 6px;
  font-weight: 800; font-size: 12.5px; color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap; }
.toggle i { width: 30px; height: 18px; border-radius: 999px; background: #cfd8e8; position: relative; transition: background .15s; flex: none; }
.toggle i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
.toggle.on i::after { transform: translateX(12px); }
.toggle.on { color: var(--text); }
.toggle.t-ob.on { border-color: #f3b4b4; background: #fff5f5; } .toggle.t-ob.on i { background: var(--bad); }
.toggle.t-fa.on { border-color: #9fdcbc; background: #f1fbf5; } .toggle.t-fa.on i { background: var(--ok); }
.toggle.t-vi.on { border-color: #b9cff3; background: #f3f7ff; } .toggle.t-vi.on i { background: var(--blue); }
.toggle:hover { border-color: var(--blue-2); }
.toggle:disabled { opacity: .55; cursor: not-allowed; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.num-mat { font-family: var(--font-d); font-weight: 700; color: var(--navy); font-size: 15px; }
.seg { display: inline-flex; background: #e3eaf6; border-radius: 11px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; font-weight: 800; color: var(--muted); cursor: pointer; font-size: 13px; }
.seg button.active { background: #fff; color: var(--navy); box-shadow: 0 1px 6px rgba(18, 52, 122, .12); }
.opt-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.opt-card { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; font-weight: 700; color: var(--text); margin: 0; }
.opt-card input { margin-top: 3px; accent-color: var(--blue); }
.opt-card:has(input:checked) { border-color: var(--blue); background: var(--sky); }
.opt-card small { display: block; font-weight: 600; color: var(--muted); }
.campo-picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; max-height: 300px; overflow-y: auto; background: var(--sky-2); border-radius: 12px; padding: 12px; }
.campo-picks .sec { grid-column: 1 / -1; font-weight: 800; color: var(--navy); font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; margin-top: 8px; }
.progress { height: 12px; background: #e6edf8; border-radius: 999px; overflow: hidden; }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--ok)); border-radius: 999px; transition: width .4s; }
.ring { --p: 0; width: 92px; height: 92px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--ok) calc(var(--p) * 1%), #e6edf8 0); }
.ring span { width: 72px; height: 72px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-weight: 900; font-family: var(--font-h); color: var(--navy); font-size: 19px; }
.subtabs { display: flex; gap: 8px; margin: 22px 0 16px; flex-wrap: wrap; }
.subtab { border: 1.5px solid var(--line); background: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 800; cursor: pointer; color: var(--muted); }
.subtab.active { border-color: var(--blue); color: var(--navy); background: var(--sky); }
.lock-banner { display: flex; gap: 16px; align-items: center; background: linear-gradient(120deg, #e9f8f0, #f5fcf8); border: 1.5px solid #9fdcbc; border-radius: var(--radius); padding: 18px 20px; margin-top: 18px; }
.lock-banner .ico { font-size: 34px; }
.lock-banner b { color: var(--ok); font-size: 16px; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: rgba(255, 255, 255, .96); backdrop-filter: blur(6px); border-top: 1px solid var(--line);
  padding: 12px 22px; display: flex; align-items: center; gap: 14px; box-shadow: 0 -6px 20px rgba(18, 52, 122, .08); }
.autosave { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
.autosave .dot { width: 10px; height: 10px; border-radius: 50%; background: #b8c4d8; }
.autosave.saving .dot { background: var(--warn); animation: blink 1s infinite; }
.autosave.saved .dot { background: var(--ok); }
.autosave.error .dot { background: var(--bad); }
.autosave.saved { color: var(--ok); }
.autosave.error { color: var(--bad); }
@keyframes blink { 50% { opacity: .3; } }
.doc-card { display: flex; gap: 16px; align-items: flex-start; }
.doc-ico { width: 52px; height: 52px; border-radius: 14px; flex: none; display: grid; place-items: center; font-size: 26px; background: var(--sky); }

  function siguienteCurso(c) {

    if (/pre ?kinder/.test(n)) return 'Kinder' + suf;
    if (/kinder/.test(n)) return '1° Básico' + suf;
    if (/basico/.test(n)) return num < 8 ? (num + 1) + '° Básico' + suf : '1° Medio' + suf;
    if (/medio/.test(n)) return num < 4 ? (num + 1) + '° Medio' + suf : 'Egresado/a';

  /* Nombre de columna para descargas/cargas: si la etiqueta se repite, se agrega la sección. */

  function fechaISO(v) {

    }
    var m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);

  /* Importa o actualiza fichas desde un Excel. Acepta:
     - el formato del registro del colegio (Rut, DV, AL Paterno, …, Curso, Apod …)

     opciones.modo: 'nuevos' (solo agrega) · 'completar' (solo llena datos vacíos) · 'sobrescribir' (reemplaza con lo del Excel).

  function importarRegistro(filas, opciones) {
    opciones = opciones || {};

      'direccion': 'est_direccion', 'apod comuna': 'est_comuna', 'apod nombre': 'apo_nombres', 'apod paterno': 'apo_apellido_paterno',
      'apod materno': 'apo_apellido_materno', 'apod celular': 'apo_celular', 'apod email': 'apo_email', 'matricula': 'fechaIngreso', 'fecha de retiro': 'fechaRetiro',

    var campos = getCampos(true), porNombre = {}, tipos = {};
    campos.forEach(function (c) {
      tipos[c.id] = c.tipo;
      porNombre[norm(etiquetaExport(c, campos))] = c.id; porNombre[norm(c.id)] = c.id;
      if (!porNombre[norm(c.etiqueta)]) porNombre[norm(c.etiqueta)] = c.id;
    });
    var mapa = filas[0].map(function (h) {
      var n = norm(h);

      for (var k in d) {

        else if (tipos[k] === 'rut') d[k] = rutFmt(d[k]);

      }
      var f = existentes[kr];
      if (f) {
        if (modo === 'nuevos') { res.omitidas++; continue; }
        var patch = {}, hay = false;
        for (var c in d) {
          if (modo === 'completar' ? !str(f[c]).trim() : str(f[c]) !== d[c]) { patch[c] = d[c]; hay = true; }
        }

  A.crearFicha = function (p, ses) {

  /* Carga masiva de estudiantes nuevos (mismo formato que el Excel "Registro Estudiantes"). */
  A.importarEstudiantes = function (p, ses) {
    var u = staffDe(ses); soloGestion(u);

    var r = importarRegistro(p.filas || [], { promover: !!p.promover, modo: modo, usuario: u.nombre + ' (carga Excel)' });
    log(u.nombre, 'Carga de base de datos (' + modo + ')', r.creadas + ' nuevas · ' + r.actualizadas + ' actualizadas · ' + r.sinCambios + ' sin cambios · ' + r.omitidas + ' omitidas');
    return r;
  };

  function validarNumero(n, rutPropio) {
    n = str(n).trim();
    if (!n) return '';

    db.all('Fichas').forEach(function (x) {
      if (rutKey(x.rut) !== rutKey(rutPropio) && norm(x.numeroMatricula) === norm(n)) fail('El N° de matrícula ' + n + ' ya está asignado a otro estudiante.');

  A.siguienteNumero = function (p, ses) { staffDe(ses); return String(numeroMayor() + 1); };

  /* Cierra el proceso: estado «Matriculado/a», N° de matrícula y funcionario que matricula. */
  A.registrarMatricula = function (p, ses) {
    var u = staffDe(ses), f = fichaAccesible(u, p.rut);

    log(u.nombre, 'Matrícula registrada N° ' + numero, rutFmt(f.rut) + ' ' + f.curso);

  /* El Equipo de Gestión habilita (o cierra) la edición para familias y/o funcionarios,

  function fichasDelAlcance(p) {
    var v = norm(p.valor);
    return db.all('Fichas').filter(function (f) {
      if (!f.rut || f.estado === 'retirado') return false;
      if (p.alcance === 'ficha') return rutKey(f.rut) === rutKey(p.valor);
      if (p.alcance === 'nivel') return norm(nivelDe(f.curso)) === v;
      if (p.alcance === 'cursoAnterior') return norm(f.cursoAnterior) === v;

  A.habilitarEdicion = function (p, ses) {

    var campos = p.campos === 'TODOS' || !lista(p.campos).length ? 'TODOS' : lista(p.campos).join(',');
    if (p.para === 'familia' || p.para === 'ambos') patch.editFamilia = campos;
    if (p.para === 'funcionarios' || p.para === 'ambos') patch.editFuncionario = 'SI';
    patch.ultimaModificacion = env.now(); patch.modificadoPor = u.nombre;
    var claves = {}; fs.forEach(function (f) { claves[rutKey(f.rut)] = 1; });
    db.update('Fichas', function (r) { return claves[rutKey(r.rut)]; }, patch);
    log(u.nombre, 'Edición habilitada para ' + p.para, fs.length + ' fichas · alcance ' + p.alcance + ' ' + str(p.valor) + ' · datos: ' + (campos === 'TODOS' ? 'todos' : campos));
    return { fichas: fs.length, ficha: p.alcance === 'ficha' ? fichaPublica(findFicha(p.valor)) : null };

  A.cerrarEdicion = function (p, ses) {

  A.desbloquearFicha = function (p, ses) { // compatibilidad: abre toda la ficha a la familia

  A.claveFamilia = function (p, ses) {

  A.eliminarFicha = function (p, ses) {

  A.estadisticas = function (p, ses) {
    var u = staffDe(ses), orden = ordenCursos(), porCurso = {};

    if (u.rol === 'gestion') getNiveles().forEach(function (n) { porCurso[norm(n)] = nuevoContador(n); });
    fichasVisibles(u).forEach(function (f) {
      var c = nivelDe(f.curso) || 'Sin nivel', key = norm(c);
      var o = porCurso[key] || (porCurso[key] = nuevoContador(c));

    var cursos = Object.keys(porCurso).map(function (k) { return porCurso[k]; });
    cursos.sort(function (a, b) {
      var oa = orden[norm(a.curso)], ob = orden[norm(b.curso)];
      return (oa === undefined ? 9999 : oa) - (ob === undefined ? 9999 : ob) || (a.curso < b.curso ? -1 : 1);

  function nuevoContador(c) {
    return { curso: c, nivel: nivelDe(c), ciclo: cicloDe(c), total: 0, pendiente: 0, en_proceso: 0, enviada: 0, desbloqueada: 0, matriculada: 0, retirado: 0, mujeres: 0, hombres: 0 };
  }

  /* ---------- funcionarios: usuarios (Equipo de Gestión) ---------- */
  function rolDe(txt) {
    var n = norm(txt);
    if (ROLES[n]) return n;
    if (/asist/.test(n)) return 'asistente';
    if (/docen|profe/.test(n)) return 'docente';
    if (/gesti|direct|equipo|admin|utp|inspector/.test(n)) return 'gestion';

  }
  function validarUsuario(d, idActual) {
    var nombre = str(d.nombre).replace(/\s+/g, ' ').trim(), email = str(d.email).trim().toLowerCase();
    if (nombre.split(' ').length < 2) fail('Ingrese nombre y apellido del funcionario (' + (nombre || 'vacío') + ').');
    if (!email) fail('Ingrese el correo institucional de ' + nombre + ' (será su usuario).');
    if (!emailValido(email)) fail('El correo de ' + nombre + ' no es válido.');
    if (!rutValido(d.rut)) fail('RUT no válido para ' + nombre + '.');
    var rol = rolDe(d.rol);

    db.all('Usuarios').forEach(function (x) {

  /* Crea la cuenta con una clave generada y la envía por correo.

  function crearCuenta(limpio, enviar) {

    limpio.id = env.uuid(); limpio.claveHash = env.hash(clave); limpio.debeCambiarClave = 'SI'; limpio.activo = 'SI'; limpio.videoVisto = 'NO';

  A.listarUsuarios = function (p, ses) {

  A.guardarUsuario = function (p, ses) {

  A.importarUsuarios = function (p, ses) {

      try {

  A.eliminarUsuario = function (p, ses) {
    var yo = staffDe(ses); soloGestion(yo);

  A.guardarDocumento = function (p, ses) {

  /* ------------------------------ despacho ----------------------------- */
  function handle(action, payload, token) {
    try {
      if (!Object.prototype.hasOwnProperty.call(A, action)) fail('Acción no reconocida: ' + action);
      var ses = null;
      if (!PUBLICAS[action]) {

    } catch (e) {
      return { ok: false, error: e && e.userMsg ? e.userMsg : 'Error interno: ' + (e && e.message ? e.message : e) };
    }
  }

  return {

}

    await guardarAhora();
  }
  window.addEventListener('beforeunload', function (e) {
    if (F && (Object.keys(pend).length || Object.keys(pendAcc).length)) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ----------- envío final ----------- */
  function irA(item) {
    if (item.doc) { cambiarTab('docs'); UI.resaltar(item.id); }
    else { cambiarTab('ficha'); UI.resaltar(item.id); }
  }
  async function enviar() {
    var root = UI.$('#tab-ficha'), datos = UI.leer(root);
    var acc = {}; UI.$$('[data-acepta]').forEach(function (c) { acc[c.dataset.acepta] = c.checked; });
    var falta = UI.validar(S.form.campos.filter(editable), datos, false).concat(docsReq().filter(function (d) { return !acc[d.id]; })
      .map(function (d) { return { id: 'doc:' + d.id, etiqueta: 'Confirmar lectura de: ' + d.titulo, seccion: 'Documentos del colegio', doc: true }; }));
    UI.marcarErrores(root, falta);
    if (falta.length) return UI.faltantes(falta, irA);
    var ok = await UI.confirm(actualizando() ? '¿Enviar los datos actualizados?' : '¿Guardar y enviar la ficha?', 'Revise que los datos estén correctos. Una vez enviada, <b>la ficha no podrá modificarse</b>, salvo autorización del equipo del establecimiento.', 'Sí, enviar', 'ok');
    if (!ok) return;
    await vaciar();
    var r = await UI.intentar(function () { return UI.api('enviarFicha', { datos: datos, aceptaciones: acc }); }, 'Guardando la ficha…');
    if (!r) return;
    if (!r.enviado) { UI.marcarErrores(root, r.faltantes); return UI.faltantes(r.faltantes, irA); }
    F = await UI.api('miFicha');
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (r.actualizacion) return UI.success('¡Datos actualizados!', 'Los cambios en la ficha de <b>' + esc(nombre()) + '</b> quedaron registrados el ' + esc(r.fecha) + '.<br><br>🔒 La ficha vuelve a quedar cerrada. ¡Gracias por mantener sus datos al día!', { boton: 'Perfecto' });
    UI.success('¡Ficha guardada y enviada!', 'Los datos de <b>' + esc(nombre()) + '</b> quedaron registrados correctamente el ' + esc(r.fecha) + '.<br><br>🔒 Desde ahora la ficha <b>no puede modificarse</b>. Si necesita realizar un cambio, comuníquese con el establecimiento: solo el equipo puede autorizar su reapertura.', { boton: 'Perfecto' });
  }

  return { iniciar: iniciar };
})();

  <script>/* js/funcionarios.js */
/* =====================================================================

  async function iniciar() {

  async function ir(v, arg) {

  /* ================================ FICHAS ================================ */
  function grupoDe(f) { return filtro.agrupar === 'anterior' ? (f.cursoAnterior || 'Estudiantes nuevos') : (f.curso || 'Sin nivel'); }
  async function vFichas(recargar) {

    filtro.agrupar = filtro.agrupar || 'nivel';

    ordenarPorGrupo().forEach(function (f) { var g = grupoDe(f); if (cursos.indexOf(g) < 0) cursos.push(g); });

      (gestion() ? '<button class="btn ghost" data-a="habilitar">🔓 Habilitar edición</button><button class="btn ghost" data-a="importar">📥 Cargar / actualizar base</button><button class="btn ghost" data-a="descargar">⬇ Descargar base de datos</button>' :

      '<select id="fl-curso"><option value="">' + (filtro.agrupar === 'anterior' ? 'Todos los cursos' : 'Todos los niveles') + '</option>' + cursos.map(function (c) { return '<option' + (c === filtro.curso ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' +
      '<select id="fl-estado"><option value="">Todos los estados</option>' + Object.keys(S.form.estados).map(function (k) { return '<option value="' + k + '"' + (k === filtro.estado ? ' selected' : '') + '>' + esc(S.form.estados[k]) + '</option>'; }).join('') + '</select>' +
      '<input class="search" id="fl-q" type="text" placeholder="🔎 Buscar por nombre, RUT o apoderado…" value="' + esc(filtro.q) + '"></div><div id="lista"></div>';
    UI.$('#fl-curso').onchange = function () { filtro.curso = this.value; pintarLista(); };
    UI.$('#fl-agr').onclick = function (e) { var b = e.target.closest('[data-g]'); if (b && b.dataset.g !== filtro.agrupar) { filtro.agrupar = b.dataset.g; filtro.curso = ''; vFichas(false); } };
    UI.$('#fl-estado').onchange = function () { filtro.estado = this.value; pintarLista(); };
    UI.$('#fl-q').oninput = UI.debounce(function () { filtro.q = UI.$('#fl-q').value; pintarLista(); }, 200);
    main().onclick = clickFichas;
    pintarLista();
  }
  function ordenarPorGrupo() {
    if (filtro.agrupar !== 'anterior') return fichas.slice();
    var orden = {}; S.form.cursos.forEach(function (c, i) { orden[norm(c)] = i; });
    function nom(f) { return norm(f.est_apellido_paterno + ' ' + f.est_apellido_materno + ' ' + f.est_nombres); }
    return fichas.slice().sort(function (a, b) {
      var oa = a.cursoAnterior ? (orden[norm(a.cursoAnterior)] !== undefined ? orden[norm(a.cursoAnterior)] : 900) : 999;
      var ob = b.cursoAnterior ? (orden[norm(b.cursoAnterior)] !== undefined ? orden[norm(b.cursoAnterior)] : 900) : 999;
      return oa - ob || (norm(a.cursoAnterior) < norm(b.cursoAnterior) ? -1 : norm(a.cursoAnterior) > norm(b.cursoAnterior) ? 1 : 0) || (nom(a) < nom(b) ? -1 : 1);
    });
  }
  function filtradas() {
    var q = norm(filtro.q);
    return ordenarPorGrupo().filter(function (f) {
      if (filtro.curso && grupoDe(f) !== filtro.curso) return false;
      if (filtro.estado && f.estado !== filtro.estado) return false;
      return !q || norm(nombreCompleto(f) + ' ' + f.rut + ' ' + UI.nombreApo(f) + ' ' + CoreUtil.rutKey(f.rut) + ' ' + (f.numeroMatricula || '')).indexOf(q) >= 0;
    });
  }
  function marcasEdicion(f) {

        g.items.map(function (f, i) {
          return '<tr><td class="muted">' + (i + 1) + '</td><td class="num-mat">' + esc(f.numeroMatricula || '—') + '</td><td><a href="#" class="name" data-a="editar" data-rut="' + esc(f.rut) + '">' + esc(UI.nombreEst(f)) + '</a></td><td class="nowrap">' + esc(f.rut) + '</td>' +

  /* Cargar o actualizar la base de datos desde Excel (registro del colegio o Excel descargado de la plataforma). */
  function importarEstudiantes() {
    var lotes = [];

        '<label style="margin-top:16px">¿Qué hacer con los estudiantes que ya existen?</label><div class="opt-cards">' +
        '<label class="opt-card"><input type="radio" name="im-m" value="nuevos"><span>Solo agregar nuevos<small>Los existentes no se tocan</small></span></label>' +

              if (idx < 0) return;

  /* modo: 'una' (una hoja) · 'ciclo' (una hoja por ciclo) · 'nivel' · 'anterior' (una hoja por curso de procedencia) */
  function exportarExcel(lista, modo, campos, nombre) {
    campos = campos || S.form.campos;
    var anio = S.form.config.anio;
    var head = ['N° matrícula', 'Nivel ' + anio, 'Ciclo', 'Curso de procedencia', 'RUT estudiante', 'Estado'].concat(campos.map(function (c) { return CoreUtil.etiquetaExport(c, campos); }),
      ['Fecha envío familia', 'Última actualización familia', 'Matriculado por', 'RUT funcionario', 'Fecha matrícula', 'Última modificación', 'Modificado por']);
    function fila(f) {
      return [f.numeroMatricula || '', f.curso, CoreUtil.cicloDe(f.curso), f.cursoAnterior || '', f.rut, S.form.estados[f.estado] || f.estado].concat(campos.map(function (c) { return f[c.id] || ''; }),
        [f.fechaEnvio || '', f.fechaActualizacion || '', f.matriculadoPorNombre || '', f.matriculadoPorRut || '', f.fechaMatricula || '', f.ultimaModificacion || '', f.modificadoPor || '']);
    }
    var grupos = {}, orden = [];
    lista.forEach(function (f) {
      var g = modo === 'ciclo' ? CoreUtil.cicloDe(f.curso) : modo === 'nivel' ? f.curso : modo === 'anterior' ? (f.cursoAnterior || 'Nuevos') : 'Fichas';
      if (!grupos[g]) { grupos[g] = []; orden.push(g); }
      grupos[g].push(f);
    });
    var wb = XLSX.utils.book_new(), usados = {};
    orden.forEach(function (g) {
      var ws = XLSX.utils.aoa_to_sheet([head].concat(grupos[g].map(fila)));
      ws['!cols'] = head.map(function (h, i) { return { wch: i < 6 ? 16 : Math.min(Math.max(String(h).length, 12), 30) }; });
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: grupos[g].length, c: head.length - 1 } }) };
      var n = String(g).replace(/[\\\/\?\*\[\]:]/g, '-').slice(0, 28), k = n, i = 2;
      while (usados[k]) k = n + ' ' + (i++);
      usados[k] = 1;
      XLSX.utils.book_append_sheet(wb, ws, k);
    });
    if (!orden.length) return UI.toast('No hay fichas para exportar', 'bad');
    XLSX.writeFile(wb, (nombre || 'Fichas_Matricula_' + anio) + '.xlsx');
    UI.toast('⬇ Archivo descargado: ' + lista.length + ' fichas', 'ok');
  }

  function cargaMasiva() {
    var filas = [];
    UI.modal({
      title: '📥 Carga masiva de funcionarios', size: 'xwide',
      html: '<ol class="steps"><li><div>Descargue la <a href="#" id="pl-f">plantilla Excel</a> y complétela (una fila por funcionario, con su <b>correo institucional</b>).</div></li>' +
        '<li><div>Súbala aquí. El sistema crea las cuentas automáticamente y <b>envía a cada funcionario un correo con su usuario y su clave</b>.</div></li></ol>' +
        '<div class="dropzone" id="dz" style="margin-top:14px">📂 <b>Pinche aquí o arrastre el archivo Excel</b><input type="file" id="fx" accept=".xlsx,.xls,.csv" hidden></div><div id="prev" style="margin-top:14px"></div>' +
        '<label class="check" style="margin-top:12px"><input type="checkbox" id="mail" checked><span>📧 Enviar a cada funcionario un correo con su usuario y su clave</span></label>',
      buttons: [{ text: 'Cancelar', cls: 'ghost', value: null }, {
        text: 'Crear cuentas', cls: 'ok', onClick: async function (el) {
          if (!filas.length) { UI.toast('Primero seleccione el archivo', 'bad'); return false; }
          try { return await UI.api('importarUsuarios', { filas: filas, enviarCorreo: el.querySelector('#mail').checked }); }
          catch (e) { UI.toast(e.userMsg || e.message, 'bad'); return false; }
        }
      }],
      onOpen: function (el) {
        var dz = el.querySelector('#dz'), fx = el.querySelector('#fx');
        el.querySelector('#pl-f').onclick = function (e) { e.preventDefault(); plantillaFuncionarios(); };
        dz.onclick = function () { fx.click(); };
        dz.ondragover = function (e) { e.preventDefault(); dz.classList.add('over'); };
        dz.ondragleave = function () { dz.classList.remove('over'); };
        dz.ondrop = function (e) { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files[0]) leer(e.dataTransfer.files[0]); };
        fx.onchange = function () { if (fx.files[0]) leer(fx.files[0]); };
        async function leer(file) {
          try {
            var wb = await UI.leerExcel(file), ws = wb.Sheets[wb.SheetNames[0]];
            var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
            var hi = rows.findIndex(function (r) { return r.some(function (c) { return /correo|mail|nombre/.test(norm(c)); }); });
            if (hi < 0) throw new Error('No se encontró la columna «CORREO INSTITUCIONAL».');
            var map = {};
            rows[hi].forEach(function (c, i) {
              var n = norm(c);
              if (/ficha/.test(n)) map.fichas = i; else if (/correo|mail/.test(n)) map.email = i; else if (/nombre/.test(n)) map.nombre = i;
              else if (/rut/.test(n)) map.rut = i; else if (/perfil|rol|cargo/.test(n)) map.rol = i; else if (/curso/.test(n)) map.cursos = i;
            });
            filas = rows.slice(hi + 1).filter(function (r) { return String(r[map.nombre] || '').trim() || String(r[map.email] || '').trim(); }).map(function (r) {
              var o = {}; for (var k in map) o[k] = String(r[map[k]] || '').trim(); return o;
            });
            el.querySelector('#prev').innerHTML = '<div class="table-wrap card" style="padding:0;max-height:300px;overflow:auto"><table class="t"><thead><tr><th>Correo (usuario)</th><th>Nombre</th><th>RUT</th><th>Perfil</th><th>Cursos</th><th>Revisión</th></tr></thead><tbody>' +
              filas.map(function (f) {
                var prob = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email || '') ? 'Falta correo válido' : !CoreUtil.rutValido(f.rut) ? 'RUT no válido' : !f.rol ? 'Falta perfil' : '';
                return '<tr><td class="small">' + esc(f.email) + '</td><td>' + esc(f.nombre) + '</td><td>' + esc(f.rut) + '</td><td>' + esc(f.rol) + '</td><td class="small">' + esc(f.cursos) + '</td><td>' + (prob ? '<span class="badge b-red">' + prob + '</span>' : '<span class="badge b-matriculada">OK</span>') + '</td></tr>';
              }).join('') + '</tbody></table></div><p class="small muted">' + filas.length + ' funcionarios encontrados en «' + esc(file.name) + '».</p>';
          } catch (e) { UI.toast('No se pudo leer el archivo: ' + e.message, 'bad'); }
        }
      }
    }).then(function (res) {
      if (!res) return;
      var c = res.filter(function (r) { return r.estado === 'creado'; }).length, a = res.filter(function (r) { return r.estado === 'actualizado'; }).length, er = res.filter(function (r) { return r.estado === 'error'; });
      var pendientes = res.filter(function (r) { return r.clave; });
      UI.modal({
        center: true, icon: er.length ? 'warning' : 'success', title: 'Carga masiva finalizada', size: 'wide',
        html: '<p style="font-size:15.5px"><b>' + c + '</b> cuentas creadas · <b>' + a + '</b> actualizadas · <b>' + er.length + '</b> con errores</p>' +
          (pendientes.length ? '<p class="small" style="color:#8a6a1f">⚠️ ' + pendientes.length + ' clave(s) no se enviaron por correo. Descárguelas para entregarlas personalmente.</p>' : '') +
          '<div class="table-wrap" style="max-height:300px;overflow:auto;text-align:left"><table class="t"><thead><tr><th>Fila</th><th>Usuario (correo)</th><th>Nombre</th><th>Resultado</th></tr></thead><tbody>' +
          res.map(function (r) { return '<tr><td>' + r.fila + '</td><td class="small">' + esc(r.usuario || '') + '</td><td>' + esc(r.nombre) + '</td><td><span class="badge ' + (r.estado === 'error' ? 'b-red' : r.clave ? 'b-gold' : 'b-matriculada') + '">' + esc(r.mensaje) + '</span></td></tr>'; }).join('') + '</tbody></table></div>',
        buttons: (pendientes.length ? [{ text: '⬇ Descargar claves no enviadas', cls: 'gold', value: false, onClick: function () {
          var wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Nombre', 'Usuario (correo)', 'Clave']].concat(pendientes.map(function (r) { return [r.nombre, r.usuario, r.clave]; }))), 'Claves');
          XLSX.writeFile(wb, 'claves_funcionarios_CONFIDENCIAL.xlsx');
          return false;
        } }] : []).concat([{ text: 'Entendido', value: true }])
      }).then(vUsuarios);
    });
  }

        if (!await UI.confirm('¿Eliminar documento?', 'Se eliminará «<b>' + esc(d.titulo) + '</b>» de la plataforma.', 'Eliminar', 'bad', 'warning')) return;
        if (await UI.intentar(function () { return UI.api('eliminarDocumento', { id: d.id }); }, 'Eliminando…')) { await refrescarForm(); vDocumentos(); }
        return;
      }
      modalDocumento(d);
    };
  }
  function modalDocumento(d) {
    var nuevo = !d;
    d = d || { tipo: 'reglamento', titulo: '', resumen: '', contenido: '', url: '', requiereAceptacion: 'SI', imprimir: 'NO', activo: 'SI', orden: String((admin.documentos.length + 1) * 10) };
    UI.modal({
      title: nuevo ? '➕ Nuevo documento o carta' : '✏️ Editar documento', size: 'wide',
      html: '<div class="grid"><div class="field"><label>Tipo</label><select id="d-tipo"><option value="reglamento">Documento institucional / reglamento</option><option value="carta">Carta (se firma con la ficha)</option></select></div>' +
        '<div class="field"><label>Orden</label><input id="d-or" type="number" value="' + esc(d.orden) + '"></div>' +
        '<div class="field full"><label>Título<span class="req">*</span></label><input id="d-ti" value="' + esc(d.titulo) + '"></div>' +
        '<div class="field full"><label>Resumen (lo que verá la familia)</label><textarea id="d-re" rows="3">' + esc(d.resumen) + '</textarea></div>' +
        '<div class="field full" id="d-cow"><label>Texto de la carta</label><textarea id="d-co" rows="9">' + esc(d.contenido) + '</textarea><small class="help">Puede usar: {{apoderado}} {{rut_apoderado}} {{estudiante}} {{rut_estudiante}} {{curso}} {{curso_anterior}} {{numero_matricula}} {{anio}} {{colegio}} {{ciudad}} {{fecha}} {{director}}</small></div>' +
        '<div class="field full"><label>Archivo del documento (PDF, Word…)</label><div class="dropzone" id="d-dz">📎 <b>Pinche para subir un archivo</b> <span class="small muted" id="d-fn">' + (d.url ? '(ya tiene un archivo; suba otro para reemplazarlo)' : '') + '</span><input type="file" id="d-file" hidden accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.png"></div></div>' +
        '<div class="field full"><label>…o enlace al documento (Google Drive, página del colegio)</label><input id="d-url" type="url" value="' + (d.url && d.url.indexOf('data:') === 0 ? '' : esc(d.url)) + '" placeholder="https://"></div>' +
        '<div class="field full row" style="gap:22px"><label class="check"><input type="checkbox" id="d-ac"' + (UI.si(d.requiereAceptacion) ? ' checked' : '') + '> Requiere confirmación de lectura (acta)</label>' +
        '<label class="check"><input type="checkbox" id="d-im"' + (UI.si(d.imprimir) ? ' checked' : '') + '> Imprimir junto a la ficha</label>' +
        '<label class="check"><input type="checkbox" id="d-vi"' + (UI.si(d.activo) ? ' checked' : '') + '> Visible</label></div></div>',
      buttons: [{ text: 'Cancelar', cls: 'ghost', value: null }, {
        text: 'Guardar', cls: 'ok', onClick: async function (el) {
          var q = function (s) { return el.querySelector(s); }, file = q('#d-file').files[0], archivo = null;
          if (file) {
            if (file.size > 25 * 1024 * 1024) { UI.toast('El archivo supera 25 MB', 'bad'); return false; }
            archivo = { nombre: file.name, mime: file.type || 'application/pdf', base64: await UI.archivoBase64(file) };
          }
          var doc = { id: d.id, tipo: q('#d-tipo').value, titulo: q('#d-ti').value, resumen: q('#d-re').value, contenido: q('#d-co').value,
            url: q('#d-url').value || (d.url && d.url.indexOf('data:') === 0 ? d.url : ''), orden: q('#d-or').value,
            requiereAceptacion: q('#d-ac').checked, imprimir: q('#d-im').checked, activo: q('#d-vi').checked };
          try { return await UI.api('guardarDocumento', { documento: doc, archivo: archivo }); } catch (e) { UI.toast(e.userMsg || e.message, 'bad'); return false; }
        }
      }],
      onOpen: function (el) {
        var t = el.querySelector('#d-tipo'); t.value = d.tipo;
        function vis() { el.querySelector('#d-cow').classList.toggle('hidden', t.value !== 'carta' && !el.querySelector('#d-co').value); }
        t.onchange = vis; vis();
        el.querySelector('#d-dz').onclick = function (e) { if (e.target.id !== 'd-file') el.querySelector('#d-file').click(); };
        el.querySelector('#d-file').onchange = function () { el.querySelector('#d-fn').textContent = this.files[0] ? '✓ ' + this.files[0].name : ''; };
      }
    }).then(async function (r) {
      if (!r) return;
      await refrescarForm();
      UI.success('Documento guardado', 'Las familias ya pueden verlo en su ficha.');
      vDocumentos();
    });
  }

  /* ============================== CONFIGURACIÓN ============================== */
  async function vConfig() {
    admin = await UI.api('datosAdmin');
    var c = admin.config;
    function inp(k, label, ph, help) { return '<div class="field"><label for="cf-' + k + '">' + label + '</label><input id="cf-' + k + '" data-cf="' + k + '" value="' + esc(c[k]) + '" placeholder="' + esc(ph || '') + '">' + (help ? '<small class="help">' + help + '</small>' : '') + '</div>'; }
    main().innerHTML = '<div class="page-h"><h2>Configuración</h2></div>' +
      '<section class="card"><div class="card-h"><div class="sec-num">🏫</div><h3>Datos del establecimiento</h3></div><div class="grid">' +
      inp('nombreColegio', 'Nombre del establecimiento') + inp('anio', 'Año escolar de la matrícula', '2027') + inp('rbd', 'RBD') + inp('ciudad', 'Ciudad') +
      inp('direccion', 'Dirección') + inp('telefono', 'Teléfono') + inp('email', 'Correo de contacto') + inp('directorNombre', 'Nombre del Director/a (firma)') +
      inp('urlPlataforma', 'Dirección (URL) de esta plataforma', 'https://usuario.github.io/fichas-matricula/', 'Se incluye en los correos enviados a funcionarios') + '</div></section>' +
      '<section class="card"><div class="card-h"><div class="sec-num">🎬</div><h3>Video tutorial</h3></div><div class="grid">' +
      inp('videoUrl', 'Enlace del video (YouTube o Google Drive)', 'https://www.youtube.com/watch?v=…', 'Se abre automáticamente la primera vez que cada persona ingresa; después queda disponible en el botón «Tutorial».') +
      '<div class="field" style="align-self:end"><button class="btn ghost" id="cf-ver">▶ Probar video</button></div></div></section>' +
      '<section class="card"><div class="card-h"><div class="sec-num">📝</div><h3>Textos</h3></div><div class="stack">' +
      '<div class="field"><label>Mensaje de bienvenida para las familias</label><textarea data-cf="mensajeBienvenida" rows="3">' + esc(c.mensajeBienvenida) + '</textarea></div>' +
      '<div class="field"><label>Texto del acta de toma de conocimiento</label><textarea data-cf="textoActa" rows="6">' + esc(c.textoActa) + '</textarea></div></div></section>' +
      '<section class="card"><div class="card-h"><div class="sec-num">🎓</div><h3>Cursos (uno por línea, en orden)</h3></div><textarea id="cf-cursos" rows="10">' + esc(admin.cursos.join('\n')) + '</textarea>' +
      '<small class="help">El ciclo se calcula automáticamente: Prekínder/Kínder → Preescolar · 1° a 4° Básico → Primer Ciclo · 5° a 8° Básico → Segundo Ciclo · 1° a 4° Medio → Enseñanza Media.</small></section>' +
      '<div class="actionbar"><span class="grow"></span><button class="btn ok lg" id="cf-save">💾 Guardar configuración</button></div>';
    UI.$('#cf-ver').onclick = function () { S.form.config.videoUrl = UI.$('#cf-videoUrl').value; App.tutorial(); };
    UI.$('#cf-save').onclick = async function () {
      var cfg = {};
      UI.$$('[data-cf]').forEach(function (el) { cfg[el.dataset.cf] = el.value; });
      var r = await UI.intentar(function () { return UI.api('guardarConfig', { config: cfg, cursos: UI.$('#cf-cursos').value }); }, 'Guardando…');
      if (!r) return;
      await refrescarForm();
      UI.success('Configuración guardada', 'Los cambios ya están disponibles para todos los usuarios.');
    };
  }

  async function vBitacora() {
    var b = await UI.api('bitacora');
    main().innerHTML = '<div class="page-h"><h2>Bitácora de actividad</h2><span class="muted small">Últimos 300 registros</span></div><section class="card" style="padding:0;overflow:hidden"><div class="table-wrap"><table class="t"><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>' +
      b.map(function (r) { return '<tr><td class="nowrap small">' + esc(r.fecha) + '</td><td>' + esc(r.usuario) + '</td><td><b>' + esc(r.accion) + '</b></td><td class="small muted">' + esc(r.detalle) + '</td></tr>'; }).join('') + '</tbody></table></div></section>';
  }

  return { iniciar: iniciar };
})();

</script>
  <script>/* js/app.js */
/* =====================================================================
   APLICACIÓN: inicio, ingreso (familias / funcionarios), barra superior,
   video tutorial y cambio de clave.
   ===================================================================== */
var App = (function () {
  'use strict';
  var esc = UI.esc, expirando = false;

  async function iniciar() {
    if (!window.APP_CONFIG.API_URL) S.demo = crearBackendDemo();
    try { S.token = sessionStorage.getItem('fm_token'); } catch (e) { S.token = null; }
    try { S.publico = await UI.api('infoPublica'); }
    catch (e) { S.publico = { config: { nombreColegio: 'Colegio Marina de Chile', anio: '', mensajeBienvenida: '' }, documentos: [], error: e.userMsg || e.message }; }
    if (S.token) {
      try { S.perfil = await UI.api('sesion'); return entrar(); }
      catch (e) { guardarToken(null); }
    }
    login();
  }
  function guardarToken(t) {
    S.token = t;
    try { if (t) sessionStorage.setItem('fm_token', t); else sessionStorage.removeItem('fm_token'); } catch (e) { /* privado */ }
  }

  /* ------------------------------- ingreso ------------------------------- */
  function login(tab) {
    var cfg = S.publico.config;
    var demo = S.demo ? S.demo.ejemploFamilia() : null;
    var pasos = [['🔑', 'Ingrese', 'Con el RUT del estudiante y su fecha de nacimiento.'], ['📝', 'Complete', 'Revise y actualice los datos. Se guardan solos.'],
      ['📚', 'Conozca', 'Lea los documentos institucionales del colegio.'], ['✅', 'Envíe', 'Confirme y envíe la ficha al establecimiento.']];
    UI.$('#app').innerHTML = '<div class="login"><div class="login-wrap">' +
      '<nav class="login-nav"><div class="brand"><img src="insignia.jpg" alt="Insignia Colegio Marina de Chile"><div><b>' + esc(cfg.nombreColegio) + '</b><span>' + esc(cfg.ciudad || 'Concepción') + '</span></div></div>' +
      '<button class="nav-link" id="lg-video">▶ <span class="hide-sm">¿Cómo funciona?</span></button></nav>' +
      '<div class="login-grid"><section class="login-hero">' +
      '<span class="pill"><i></i>Admisión y matrículas ' + esc(cfg.anio) + '</span>' +
      '<h1 class="hero-title">Un futuro que<br>comienza <em>aquí.</em></h1>' +
      '<p class="hero-lead">' + esc(cfg.mensajeBienvenida) + '</p>' +
      '<div class="hero-cta"><button class="btn dark lg" id="lg-ir">Completar la ficha →</button><button class="btn soft lg" id="lg-video2">▶ Ver tutorial</button></div>' +
      '<div class="hero-steps">' + pasos.map(function (p) { return '<div class="hero-step"><div class="ic">' + p[0] + '</div><b>' + p[1] + '</b><span>' + p[2] + '</span></div>'; }).join('') + '</div>' +
      '</section><section class="login-side" id="lg-side"><div class="login-box">' +
      (S.publico.error ? '<div class="demo-banner" style="background:var(--bad-bg);border-color:#f3c4c4;color:var(--bad)">⚠️ ' + esc(S.publico.error) + '</div>' : '') +
      (S.demo ? '<div class="demo-banner">🧪 <b>Modo demostración</b> (los datos quedan solo en este navegador).<br>Familia: RUT <code data-fill="f">' + esc(demo && demo.rut) + '</code> clave <code data-fill="f">' + esc(demo && demo.clave) + '</code><br>' +
        'Funcionarios (clave <code>demo1234</code>): <code data-fill="g">gestion.demo@colegio.cl</code> · <code data-fill="d">docente.demo@colegio.cl</code> · <code data-fill="a">asistente.demo@colegio.cl</code> · <a href="#" id="demo-reset">Reiniciar demo</a></div>' : '') +
      '<div class="card" style="margin-top:46px"><div class="crest-float"><img src="insignia.jpg" alt=""></div><h2>Ingresar</h2><p class="muted" style="margin:-4px 0 16px">Seleccione su tipo de acceso.</p>' +
      '<div class="tabs" role="tablist"><button class="tab" data-t="familia">👨‍👩‍👧 Familias</button><button class="tab" data-t="staff">🧑‍🏫 Funcionarios</button></div>' +
      '<div id="lg-familia">' +
      '<form id="ff" class="stack" autocomplete="off"><div class="field"><label for="ff-rut">RUT del estudiante</label><input id="ff-rut" inputmode="text" placeholder="12345678-9" required></div>' +
      '<div class="field"><label for="ff-cl">Clave</label><input id="ff-cl" type="password" placeholder="DDMMAAAA" required></div>' +
      '<div class="hint">🔑 La clave inicial es la <b>fecha de nacimiento del estudiante</b> en formato <b>DDMMAAAA</b> (ej.: 15 de marzo de 2019 → <b>15032019</b>). Si la cambió, use su clave nueva.</div>' +
      '<button class="btn dark lg" type="submit">Ingresar</button><p class="small muted" style="margin:0;text-align:center">¿Olvidó su clave? Comuníquese con el establecimiento para restablecerla.</p></form></div>' +
      '<div class="hidden" id="lg-staff">' +
      '<form id="fs" class="stack"><div class="field"><label for="fs-us">Usuario (correo institucional)</label><input id="fs-us" type="email" inputmode="email" placeholder="nombre@colegio.cl" required autocomplete="username"></div>' +
      '<div class="field"><label for="fs-cl">Clave</label><input id="fs-cl" type="password" placeholder="Clave recibida por correo o su clave personal" required autocomplete="current-password"></div>' +
      '<div class="hint">📧 La clave inicial le llegó a su <b>correo institucional</b> al crearse su cuenta. Respete mayúsculas y minúsculas.</div>' +
      '<button class="btn dark lg" type="submit">Ingresar</button><a href="#" id="fs-olv" class="small" style="text-align:center">¿Olvidó su clave?</a></form></div>' +
      '</div><div class="login-foot">Sus datos se guardan de forma segura y solo son vistos por el establecimiento.</div></div></section></div></div></div>';
    function verTab(t) {
      UI.$$('.tab').forEach(function (b) { b.classList.toggle('active', b.dataset.t === t); });
      UI.$('#lg-familia').classList.toggle('hidden', t !== 'familia');
      UI.$('#lg-staff').classList.toggle('hidden', t !== 'staff');
    }
    verTab(tab || 'familia');
    UI.$('.tabs').onclick = function (e) { var b = e.target.closest('[data-t]'); if (b) verTab(b.dataset.t); };
    UI.$('#lg-video').onclick = UI.$('#lg-video2').onclick = function () { tutorial(false); };
    UI.$('#lg-ir').onclick = function () { verTab('familia'); UI.$('#lg-side').scrollIntoView({ behavior: 'smooth' }); setTimeout(function () { UI.$('#ff-rut').focus({ preventScroll: true }); }, 400); };
    UI.$('#ff-rut').onblur = function () { if (this.value.trim()) this.value = CoreUtil.rutFmt(this.value); };
    UI.$('#ff').onsubmit = async function (e) {
      e.preventDefault();
      var r = await UI.intentar(function () { return UI.api('loginFamilia', { rut: UI.$('#ff-rut').value, clave: UI.$('#ff-cl').value }); }, 'Ingresando…');
      if (r) { guardarToken(r.token); S.perfil = r.perfil; entrar(); }
    };
    UI.$('#fs').onsubmit = async function (e) {
      e.preventDefault();
      var r = await UI.intentar(function () { return UI.api('loginFuncionario', { usuario: UI.$('#fs-us').value, clave: UI.$('#fs-cl').value }); }, 'Ingresando…');
      if (r) { guardarToken(r.token); S.perfil = r.perfil; entrar(); }
    };
    UI.$('#fs-olv').onclick = function (e) { e.preventDefault(); recuperar(); };
    if (S.demo) {
      UI.$('.demo-banner').onclick = function (e) {
        var c = e.target.closest('[data-fill]');
        if (c && c.dataset.fill === 'f') { verTab('familia'); UI.$('#ff-rut').value = demo.rut; UI.$('#ff-cl').value = demo.clave; }
        else if (c) {
          var m = { g: ['gestion.demo@colegio.cl', 'demo1234'], d: ['docente.demo@colegio.cl', 'demo1234'], a: ['asistente.demo@colegio.cl', 'demo1234'] }[c.dataset.fill];
          verTab('staff'); UI.$('#fs-us').value = m[0]; UI.$('#fs-cl').value = m[1];
        }
      };
      UI.$('#demo-reset').onclick = function (e) { e.preventDefault(); S.demo.reiniciar(); location.reload(); };
    }
  }

  function recuperar() {
    UI.modal({
      title: '🔑 Recuperar clave de funcionario',
      html: '<p class="muted" style="margin-top:0">Escriba su <b>correo institucional</b>. Le enviaremos una <b>clave temporal</b> y, al ingresar, el sistema le pedirá crear una nueva. También puede pedir al Equipo de Gestión que restablezca su clave.</p>' +
        '<div class="field"><label>Correo institucional</label><input id="rc-em" type="email" placeholder="nombre@colegio.cl" value="' + esc((UI.$('#fs-us') || {}).value || '') + '"></div>',
      buttons: [{ text: 'Cancelar', cls: 'ghost', value: null }, {
        text: '📧 Enviar clave temporal', onClick: async function (el) {
          try { return await UI.api('recuperarClave', { email: el.querySelector('#rc-em').value }); }
          catch (e) { UI.toast(e.userMsg || e.message, 'bad'); return false; }
        }
      }]
    }).then(function (msg) { if (msg) UI.success('Solicitud recibida', esc(msg)); });
  }

  async function entrar() {
    UI.loading('Cargando su información…');
    try {
      if (S.perfil.tipo === 'familia') await Familia.iniciar();
      else await Staff.iniciar();
    } catch (e) {
      UI.done();
      await UI.error('No se pudo cargar', e.userMsg || e.message);
      return salir();
    }
    UI.done();
    if (S.perfil.debeCambiarClave) await cambiarClave(true);
    if (!S.perfil.videoVisto) {
      await tutorial(true);
      S.perfil.videoVisto = true;
      UI.api('marcarVideoVisto').catch(function () { /* no crítico */ });
    }
  }

  /* --------------------------- barra superior --------------------------- */
  function topbar(nombre, sub) {
    var cfg = (S.form && S.form.config) || S.publico.config;
    return '<header class="topbar"><img src="insignia.jpg" alt="Insignia"><div><div class="t1">' + esc(cfg.nombreColegio) + '</div><div class="t2">Fichas de Matrícula ' + esc(cfg.anio) + '</div></div>' +
      '<div class="user-chip"><button class="btn ghost sm" data-top="tutorial" title="Ver tutorial">🎬 <span class="hide-sm">Tutorial</span></button>' +
      '<button class="btn ghost sm" data-top="clave" title="Cambiar clave">🔑 <span class="hide-sm">Mi clave</span></button>' +
      '<div class="avatar">' + esc(UI.iniciales(nombre)) + '</div><div><div class="n">' + esc(nombre) + '</div><div class="r">' + esc(sub) + '</div></div>' +
      '<button class="btn ghost sm" data-top="salir">Salir</button></div></header>';
  }
  function enlazarTopbar() {
    UI.$('.topbar').onclick = function (e) {
      var b = e.target.closest('[data-top]'); if (!b) return;
      if (b.dataset.top === 'tutorial') tutorial(false);
      if (b.dataset.top === 'clave') cambiarClave(false);
      if (b.dataset.top === 'salir') salir();
    };
  }
  async function salir() {
    if (S.token) UI.api('logout').catch(function () { /* ya expirada */ });
    guardarToken(null); S.perfil = null; S.form = null;
    login();
  }
  async function sesionExpirada() {
    if (expirando || !S.perfil) return;
    expirando = true;
    guardarToken(null); S.perfil = null;
    await UI.error('Sesión expirada', 'Por seguridad su sesión se cerró. Ingrese nuevamente; los datos guardados se conservan.');
    expirando = false;
    login();
  }

  /* ---------------------------- video tutorial ---------------------------- */
  function embed(url) {
    url = String(url || '').trim();
    if (!url) return '';
    var m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
    if (m) return '<div class="video-frame"><iframe src="https://www.youtube.com/embed/' + m[1] + '?rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>';
    m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
    if (m) return '<div class="video-frame"><iframe src="https://drive.google.com/file/d/' + m[1] + '/preview" allow="autoplay" allowfullscreen></iframe></div>';
    if (/\.(mp4|webm)(\?|$)/i.test(url)) return '<div class="video-frame"><video src="' + esc(url) + '" controls></video></div>';
    return '<div class="video-frame"><iframe src="' + esc(url) + '" allowfullscreen></iframe></div>';
  }
  function tutorial(primeraVez) {
    var cfg = (S.form && S.form.config) || S.publico.config, tipo = S.perfil ? S.perfil.tipo : null;
    var pasos = tipo === 'staff' ? [
      'En <b>Fichas de matrícula</b> verá los estudiantes ordenados por curso y por apellido.',
      'Pinche ✏️ para revisar o editar una ficha. Los cambios se guardan automáticamente.',
      'Presione <b>✅ Registrar matrícula</b>: su nombre y RUT quedarán en el espacio de firma.',
      'Use 🖨 para imprimir, ⬇ para descargar en PDF o 💬 para compartir por WhatsApp.',
      'Si una familia necesita corregir datos, use <b>🔓 Desbloquear para la familia</b>.',
      'En <b>Resumen estadístico</b> verá el avance por curso, nivel y ciclo.'
    ] : [
      'Ingrese con el <b>RUT del estudiante</b> y su <b>fecha de nacimiento</b> (DDMMAAAA) como clave.',
      'Revise y complete los datos de cada sección. Los marcados con <span class="req">*</span> son obligatorios.',
      'Cada cambio se <b>guarda automáticamente</b>: puede salir y volver a entrar cuando quiera.',
      'En <b>📚 Documentos del colegio</b> lea el PEI, el Reglamento Interno y el de Evaluación, y confirme su lectura.',
      'Al terminar presione <b>💾 Guardar y enviar ficha</b>. Luego ya no podrá modificarla sin autorización del colegio.',
      'Puede cambiar su clave en el botón <b>🔑 Mi clave</b>.'
    ];
    return UI.modal({
      title: '🎬 ' + (primeraVez ? '¡Bienvenido/a! Así funciona la plataforma' : 'Cómo funciona la plataforma'), size: 'wide',
      html: (embed(cfg.videoUrl) ? embed(cfg.videoUrl) + '<h4 style="margin:18px 0 10px">Pasos principales</h4>' : '') + '<ol class="steps">' + pasos.map(function (p) { return '<li><div>' + p + '</div></li>'; }).join('') + '</ol>' +
        (primeraVez ? '<p class="small muted" style="margin-bottom:0">Este tutorial se muestra solo la primera vez. Puede volver a verlo cuando quiera con el botón <b>🎬 Tutorial</b>.</p>' : ''),
      buttons: [{ text: primeraVez ? '¡Comenzar!' : 'Cerrar', cls: primeraVez ? 'gold lg' : 'ghost', value: true }],
      noBackdropClose: true
    });
  }

  /* ----------------------------- cambio de clave ----------------------------- */
  function cambiarClave(forzado) {
    var fam = S.perfil.tipo === 'familia';
    return UI.modal({
      title: '🔑 ' + (forzado ? 'Debe crear una clave nueva' : 'Cambiar mi clave'), dismissable: !forzado,
      html: (forzado ? '<div class="hint" style="background:var(--warn-bg);border-left:4px solid var(--warn);padding:10px 12px;border-radius:8px;margin-bottom:14px">El establecimiento solicitó que cree una clave nueva para continuar.</div>' : '') +
        '<div class="stack"><div class="field"><label>Clave actual</label><input id="ck-a" type="password" placeholder="' + (fam ? 'Fecha de nacimiento (DDMMAAAA) o su clave' : 'La clave que recibió por correo o su clave actual') + '"></div>' +
        '<div class="field"><label>Clave nueva (mínimo 6 caracteres)</label><input id="ck-n" type="password" autocomplete="new-password"></div>' +
        '<div class="field"><label>Repita la clave nueva</label><input id="ck-r" type="password" autocomplete="new-password"></div></div>',
      buttons: (forzado ? [] : [{ text: 'Cancelar', cls: 'ghost', value: null }]).concat([{
        text: 'Guardar clave', cls: 'ok', onClick: async function (el) {
          var n = el.querySelector('#ck-n').value;
          if (n.length < 6) { UI.toast('La clave nueva debe tener al menos 6 caracteres', 'bad'); return false; }
          if (n !== el.querySelector('#ck-r').value) { UI.toast('Las claves nuevas no coinciden', 'bad'); return false; }
          try { await UI.api('cambiarClave', { actual: el.querySelector('#ck-a').value, nueva: n }); return true; }
          catch (e) { UI.toast(e.userMsg || e.message, 'bad'); return false; }
        }
      }])
    }).then(function (ok) {
      if (!ok) return;
      S.perfil.debeCambiarClave = false;
      return UI.success('Clave actualizada', 'Desde ahora ingrese con su clave nueva. Guárdela en un lugar seguro.');
    });
  }

  return { iniciar: iniciar, topbar: topbar, enlazarTopbar: enlazarTopbar, tutorial: tutorial, sesionExpirada: sesionExpirada };
})();

document.addEventListener('DOMContentLoaded', App.iniciar);

</script>
</body>
</html>
